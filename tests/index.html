<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/favicon.png">
<title>定期テスト自動作成</title>
<meta name="ver" content="5">
<meta name="description" content="単元を選ぶだけで、100点満点の定期テスト・単元テストを自動作成。解答用紙・解答と解説つき、A4で印刷できます。中学1年〜3年の理科、中2英語（リスニングつき）など。クロラボのオリジナル問題です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: a settings panel (screen only) above a stack of A4 "paper" sheets: 問題 → 解答用紙 → 解答・解説. Printing hides the panel and breaks pages per sheet. */
:root {
  --board: #1f4a3c;
  --board-deep: #173a2f;
  --chalk: #f3f1e7;
  --chalk-dim: #b9c7bd;
  --gold: #e8b64c;
  --paper: #f7f4ea;
  --card: #fffdf6;
  --ink: #23302a;
  --ink-soft: #5b6a62;
  --line: #e2dccb;
  --f-chalk: "Klee One", "Hiragino Mincho ProN", serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: #e9e5d8; }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) 48px; }
.back { color: var(--ink-soft); font-size: 14px; text-decoration: none; }

.panel { background: var(--board); color: var(--chalk); border-radius: 12px; padding: 18px; display: grid; gap: 14px; margin: 10px 0 20px; }
.panel header { display: flex; gap: 12px; align-items: center; }
.panel header img { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--gold); }
.panel h1 { font-family: var(--f-chalk); font-weight: 600; font-size: clamp(22px, 5vw, 30px); margin: 0; line-height: 1.3; }
.panel p { margin: 0; font-size: 13px; color: var(--chalk-dim); }
.row { display: grid; gap: 6px; }
.row > span { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--chalk-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label span { display: inline-block; border: 1.5px solid rgba(243,241,231,.45); border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 700; }
.seg input:checked + span { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.seg input:focus-visible + span { outline: 3px solid var(--chalk); outline-offset: 2px; }
.seg input:disabled + span { opacity: .4; cursor: default; }
.panel input[type=text], .panel input[type=number] { font: inherit; border-radius: 8px; border: 0; padding: 6px 10px; width: 100%; max-width: 360px; color: var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 9px 20px; border: 2px solid var(--chalk); background: transparent; color: var(--chalk); }
.btn.main { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.btn:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.note { font-size: 12px; color: var(--chalk-dim); }
.units { display: grid; gap: 6px; }
.urow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.urow .seg { flex: 1 1 240px; }
.urow select, .panel select { font: inherit; font-size: 14px; border-radius: 8px; border: 0; padding: 4px 8px; color: var(--ink); }
.urow small { font-size: 12px; color: var(--chalk-dim); }
.summary { font-size: 14px; color: var(--ink-soft); margin: 0 0 10px; }

/* paper */
.sheet { background: #fff; color: #111; width: 100%; max-width: 794px; margin: 0 auto 24px; padding: 40px 44px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-family: "Hiragino Mincho ProN", "Yu Mincho", "Klee One", serif; font-size: 14px; line-height: 1.75; }
.sheet h2 { font-family: var(--f-body); font-size: 20px; text-align: center; margin: 0 0 4px; }
.sheet .sub { text-align: center; margin: 0 0 10px; font-size: 13px; }
.namebar { display: grid; grid-template-columns: 1fr 1fr 2.4fr 1.4fr; border: 1.5px solid #111; margin-bottom: 18px; font-family: var(--f-body); font-size: 12px; }
.namebar div { border-right: 1px solid #111; padding: 4px 8px; min-height: 40px; }
.namebar div:last-child { border-right: 0; }
.namebar b { display: block; font-size: 11px; }
.dq { margin: 0 0 20px; break-inside: auto; }
.dq h3 { font-family: var(--f-body); font-size: 15px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; border-bottom: 1.5px solid #111; padding-bottom: 2px; }
.dq h3 .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1.5px solid #111; font-size: 15px; }
.dq h3 .pts { margin-left: auto; font-size: 12px; font-weight: 500; }
.lead { margin: 0 0 8px; }
.intro { break-inside: avoid; }
.fig { margin: 6px 0 10px; overflow-x: auto; }
.fig svg { max-width: 100%; height: auto; }
.exp { display: block; margin: 4px 0 6px; padding: 4px 8px; border-left: 3px solid #111; }
.exp .st { display: block; padding-left: 1.2em; text-indent: -1.2em; }
.talk { display: block; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; margin: 6px 0; }
.talk span { display: block; padding-left: 4.5em; text-indent: -4.5em; }
.tcap { font-size: 12px; margin-top: 6px; }
.fc { display: inline-block; margin: 4px 14px 4px 0; vertical-align: top; max-width: 100%; }
.fc svg { display: block; }
.fc figcaption { font-size: 12px; text-align: center; margin-top: 2px; }
.tbl { border-collapse: collapse; margin: 6px 0; font-size: 13px; font-family: var(--f-body); }
.tbl th, .tbl td { border: 1px solid #111; padding: 2px 8px; text-align: center; }
.tbl th { background: #f2f2f2; font-weight: 700; }
.items { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.items li { display: grid; grid-template-columns: auto 1fr; gap: 6px; break-inside: avoid; }
.items .n { font-family: var(--f-body); font-weight: 700; }
.items .ch { display: grid; gap: 0 16px; margin-top: 2px; padding-left: 1em; }
.items .ch.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.items .ch.pics { display: flex; flex-wrap: wrap; gap: 8px 14px; padding-left: 1em; }
.pic { display: inline-flex; gap: 4px; align-items: flex-start; font-family: var(--f-body); }
.pic svg { display: block; border: 1px solid #999; border-radius: 4px; }
.passage { border: 1px solid #555; padding: 8px 12px; margin: 6px 0 8px; line-height: 1.95; }
.passage p { margin: 0 0 4px; text-indent: 1em; }
.passage.en { font-family: "Times New Roman", "Hiragino Mincho ProN", serif; font-size: 15px; line-height: 1.7; }
.passage.en p { text-indent: 1.4em; }
.passage .pn { font-family: var(--f-body); font-size: 12px; margin-right: 4px; }
.passage .bl { display: inline-block; min-width: 3em; border-bottom: 1px solid #111; text-align: center; font-family: var(--f-body); font-size: 12px; text-indent: 0; }
.passage u, .lead u { text-underline-offset: 3px; }
.passage.jp { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Klee One", serif; font-size: 14.5px; line-height: 2; }
.passage.jp p { margin-bottom: 2px; }
.passage.kanshi { display: block; width: fit-content; padding: 8px 22px; letter-spacing: .25em; line-height: 1.8; }
.passage.kanshi p { text-indent: 0; } .passage.kanshi .kt { font-weight: 700; letter-spacing: .1em; }
.chu { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11.5px; color: #333; margin: -2px 0 8px; }
.sbars { display: grid; gap: 4px; margin: 6px 0; font-size: 12.5px; }
.sbars .sb { display: flex; align-items: center; gap: 8px; } .sbars .sl { width: 15em; text-align: right; }
.sbars .sv { height: 14px; background: #8fb3d9; border: 1px solid #3c6e9e; -webkit-print-color-adjust: exact; print-color-adjust: exact; } .sbars .sn { font-size: 12px; }
.ans-grid .cell.essay { min-height: 0; }
.ans-grid .cell.essay { display: block; } .genko { display: block; margin: 20px auto 6px; max-width: 100%; height: auto; }
.en-q { font-family: "Times New Roman", serif; font-size: 15px; }
.listen-note { font-family: var(--f-body); font-size: 12.5px; border: 1px dashed #555; padding: 4px 8px; margin: 0 0 8px; }
.script .say { margin: 2px 0; }
.script .say.en { font-family: "Times New Roman", serif; font-size: 15px; padding-left: 1em; }
.script .say.ja { font-family: var(--f-body); font-size: 13px; }
.script .say.pause { color: #777; font-size: 12px; font-family: var(--f-body); }
.player { background: var(--board-deep); color: var(--chalk); border-radius: 12px; padding: 12px 16px; margin: 0 0 16px; display: grid; gap: 8px; }
.player p { margin: 0; font-size: 13px; color: var(--chalk-dim); }
.player .now { color: var(--gold); font-weight: 700; font-size: 14px; }
.ans-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1.5px solid #111; border-left: 1.5px solid #111; margin-bottom: 14px; }
.ans-grid .cell { border-right: 1.5px solid #111; border-bottom: 1.5px solid #111; min-height: 46px; padding: 2px 6px; font-family: var(--f-body); font-size: 11px; display: flex; justify-content: space-between; }
.ans-grid .cell.wide { grid-column: 1 / -1; min-height: 72px; }
.ans-grid .cell .p { color: #555; }
.ans-head { font-family: var(--f-body); font-weight: 700; margin: 0 0 4px; }
.key li { grid-template-columns: auto 1fr; }
.key .a { font-family: var(--f-body); font-weight: 700; }
.key .x { font-size: 12.5px; color: #333; }
.key .c { font-size: 12px; color: #6b4a00; }
.foot { font-family: var(--f-body); font-size: 10px; color: #777; text-align: right; margin-top: 12px; }
@media (max-width: 600px) { .sheet { padding: 22px 16px; } .ans-grid { grid-template-columns: 1fr; } .namebar { grid-template-columns: 1fr 1fr; } }

/* 国語の縦書き（A4横・右から左へ） */
.sheet.tate { max-width: none; width: fit-content; padding: 24px; overflow-x: auto; }
.tpage { writing-mode: vertical-rl; width: 273mm; height: 186mm; overflow: hidden; font-size: 14.5px; line-height: 1.8; margin-left: auto; }
.tpage > * { margin: 0 0 0 8px; }
.tpage .thead h2 { font-size: 21px; text-align: start; margin: 0 0 0 6px; letter-spacing: .1em; }
.tpage .thead .sub { text-align: start; font-size: 12.5px; margin: 0 0 0 10px; }
.tpage .vname { display: inline-flex; flex-direction: column; border: 1.5px solid #111; margin: 0 0 0 16px; font-size: 13px; }
.tpage .vname div { border-bottom: 1px solid #111; padding: 6px 4px; }
.tpage .vname div:last-child { border-bottom: 0; }
.tpage .vname .nm { flex: 1; min-height: 10em; }
.tpage h3.th { font-family: var(--f-body); font-size: 15.5px; border-right: 2px solid #111; padding: 0 6px 0 0; margin: 0 0 0 10px; }
.tpage h3.th .num { display: inline-block; border: 1.5px solid #111; padding: 2px 3px; margin-bottom: 6px; }
.tpage h3.th .pts { font-size: 12px; font-weight: 400; margin-top: 10px; }
.tpage .tlead { margin-left: 6px; }
.tpage .tp { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Klee One", serif; font-size: 15px; line-height: 2.05; text-indent: 1em; }
.tpage .tp.nb { text-indent: 0; }
.tpage .tp .pn { font-size: 11px; margin-bottom: 2px; text-indent: 0; }
.tpage .tpbox-start { border-right: 1px solid #555; padding-right: 8px; }
.tpage .tpbox-end { border-left: 1px solid #555; padding-left: 8px; margin-left: 14px; }
.tpage .chu { display: block; font-size: 12px; margin: 0 0 0 10px; }
.tpage .chu span { display: block; }
.tpage .titem { display: flex; gap: 6px; }
.tpage .titem .n { font-family: var(--f-body); font-weight: 700; }
.tpage .titem .ch { display: block; padding: 0; margin: 1em 0 0 0; }
.tpage .titem .ch span { display: block; }
.tpage .titem .chs { margin-right: 4px; }
.tpage u { text-decoration-thickness: 1px; text-underline-position: right; text-underline-offset: 3px; }
.tpage .tcy { text-combine-upright: all; }
.tpage .upr { text-orientation: upright; }
.tpage .horiz { writing-mode: horizontal-tb; width: max-content; max-width: 160mm; margin: 0 0 0 12px; font-size: 13px; }
.tpage .horiz .sbars .sl { width: 12em; }
.tpage .kanshi { margin: 0 0 0 12px; border: 1px solid #555; padding: 12px 6px; letter-spacing: .2em; display: block; width: auto; }
.tpage .kanshi p { margin: 0 0 0 6px; text-indent: 0; }
.tpage .foot { font-size: 11px; margin: 0; align-self: flex-end; }
@media print {
  @page { size: A4; margin: 12mm; }
  @page tate { size: A4 landscape; margin: 12mm; }
  .sheet.tate { page: tate; padding: 0; overflow: visible; width: auto; }
  html, body { background: #fff; }
  .wrap { max-width: none; padding: 0; }
  .panel, .back, .summary, .noprint { display: none !important; }
  .sheet { box-shadow: none; max-width: none; margin: 0; padding: 0; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .dq h3 { break-after: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back noprint" href="../index.html">← クロ先生のAI職員室へ</a>

  <section class="panel" aria-label="テストの設定">
    <header>
      <img src="../assets/kuro.jpg" alt="クロ先生" width="52" height="52">
      <div>
        <h1>定期テスト自動作成</h1>
        <p>単元を選ぶだけで、100点満点のテストと解答用紙・解答解説ができます。問題はすべてクロラボのオリジナルです。</p>
      </div>
    </header>
    <div class="row"><span>教科</span>
      <div class="seg" id="subj"></div>
    </div>
    <div class="row"><span>テストの種類</span>
      <div class="seg">
        <label><input type="radio" name="mode" value="term" checked><span>定期テスト（単元を組み合わせる）</span></label>
        <label><input type="radio" name="mode" value="unit"><span>単元別テスト</span></label>
      </div>
    </div>
    <div class="row"><span>難易度</span>
      <div class="seg" id="lvSeg">
        <label><input type="radio" name="lv" value="2" checked><span>入試レベル（資料の読み取り・計算・考察）</span></label>
        <label><input type="radio" name="lv" value="1"><span>基本〜標準</span></label>
        <label><input type="radio" name="lv" value="0"><span>両方まぜる</span></label>
      </div>
    </div>
    <div class="row"><span id="unitLabel">単元ごとの大問の数（0 にした単元は出題しません）</span><div class="units" id="units"></div></div>
    <div class="row"><span>1つの大問の小問の数</span>
      <div class="seg" id="perSeg">
        <label><input type="radio" name="per" value="99" checked><span>すべて（5〜8問）</span></label>
        <label><input type="radio" name="per" value="5"><span>5問まで</span></label>
        <label><input type="radio" name="per" value="4"><span>4問まで</span></label>
      </div>
    </div>
    <div class="row"><span>テストの名前</span><input type="text" id="title" value="2学期 中間テスト"></div>
    <div class="row"><span>つけるもの</span>
      <div class="seg">
        <label><input type="checkbox" id="optSheet" checked><span>解答用紙</span></label>
        <label><input type="checkbox" id="optKey" checked><span>解答・解説</span></label>
      </div>
    </div>
    <div class="btns">
      <button class="btn main" id="make" type="button">テストを作る</button>
      <button class="btn" id="remake" type="button">別の問題で作り直す</button>
      <button class="btn" id="print" type="button">印刷する（A4）</button>
    </div>
    <p class="note">入試レベルは、各県の公立高校入試で正答率が下がりやすい「資料の読み取り・条件を整理する計算・理由の説明」を中心にしたクロラボのオリジナル問題です。テスト番号を控えておけば、同じテストをもう一度作れます：<input type="number" id="seed" style="width:120px;display:inline-block;padding:2px 6px" aria-label="テスト番号"></p>
  </section>

  <p class="summary" id="summary"></p>
  <div class="player noprint" id="player" hidden></div>
  <div id="out"></div>
</div>

<script src="common.js"></script>
<script src="sci1.js"></script>
<script>
const $ = id => document.getElementById(id);
const KANA = ["ア", "イ", "ウ", "エ"];
const WEIGHT = { word: 2, choice: 3, order: 3, calc: 4, desc: 5 };
// 教科の一覧（file は必要になったときに読み込む）
const SUBJ = [
  { key: "sci1", label: "中1 理科", file: "sci1.js" },
  { key: "sci2", label: "中2 理科", file: "sci2.js" },
  { key: "sci3", label: "中3 理科", file: "sci3.js" },
  { key: "math2", label: "中2 数学", file: "math2.js" },
  { key: "eng2", label: "中2 英語（リスニングつき）", file: "eng2.js" },
  { key: "soc2", label: "中2 社会", file: "soc2.js" },
  { key: "jpn2", label: "中2 国語", file: "jpn2.js" }
];

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const shuffleR = (a, r) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// 作文の原稿用紙（20字×10行、印刷でも線が出るよう SVG でかく）
const genko = () => { let g = ""; for (let i = 0; i <= 20; i++) g += `<line x1="${i * 22 + 0.5}" y1="0.5" x2="${i * 22 + 0.5}" y2="220.5"/>`; for (let j = 0; j <= 10; j++) g += `<line x1="0.5" y1="${j * 22 + 0.5}" x2="440.5" y2="${j * 22 + 0.5}"/>`; return `<svg class="genko" viewBox="0 0 441 221" width="441" height="221" stroke="#888" stroke-width="1">${g}</svg>`; };
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const subjKey = () => document.querySelector("input[name=subj]:checked").value;
const data = () => window.KUROTEST[subjKey()];
const mode = () => document.querySelector("input[name=mode]:checked").value;
const lv = () => +document.querySelector("input[name=lv]:checked").value;
// lv 0 の大問（リスニングなど）は、どの難易度でも出題する
const pool = u => data().templates.filter(t => t.unit === u && (lv() === 0 || !t.lv || t.lv === lv()));
const maxOf = u => Math.min(pool(u).length, (data().unitMax || {})[u] ?? 99);

$("subj").innerHTML = SUBJ.map((x, i) => `<label><input type="radio" name="subj" value="${x.key}" ${i === 0 ? "checked" : ""} ${x.soon ? "disabled" : ""}><span>${x.label}${x.soon ? "（準備中）" : ""}</span></label>`).join("");
function loadSubj(key) {
  return new Promise((ok, ng) => {
    if (window.KUROTEST && window.KUROTEST[key]) return ok();
    const sc = document.createElement("script");
    sc.src = SUBJ.find(x => x.key === key).file + "?v=" + (document.querySelector("meta[name=ver]")?.content || "1");
    sc.onload = () => ok(); sc.onerror = () => ng(new Error("load")); document.body.appendChild(sc);
  });
}

function renderUnits(reset) {
  const d = data(), m = mode();
  const keep = {};
  if (!reset) document.querySelectorAll("#units select").forEach(x => keep[x.dataset.u] = +x.value);
  const defOf = (k, i) => (d.defaults && k in d.defaults) ? d.defaults[k] : (i < 2 ? 3 : 0);
  const opt = (u, def) => { const n = maxOf(u); const v = Math.min(keep[u] ?? def, n); return Array.from({ length: n + 1 }, (_, i) => `<option value="${i}" ${i === v ? "selected" : ""}>${i}</option>`).join(""); };
  if (m === "term") {
    $("unitLabel").textContent = "単元ごとの大問の数（0 にした単元は出題しません）";
    $("units").innerHTML = Object.entries(d.units).map(([k, v], i) =>
      `<div class="urow"><div class="seg"><label><input type="checkbox" name="unit" value="${k}" ${(keep[k] ?? defOf(k, i)) > 0 ? "checked" : ""}><span>${v}</span></label></div><select data-u="${k}" aria-label="${v}の大問の数">${opt(k, defOf(k, i))}</select><small>大問（最大 ${maxOf(k)}）</small></div>`).join("");
  } else {
    const cur0 = document.querySelector("input[name=unit]:checked")?.value;
    const cur = cur0 && d.units[cur0] ? cur0 : Object.keys(d.units)[0];
    $("unitLabel").textContent = "単元（1つ選ぶ）と大問の数";
    $("units").innerHTML = `<div class="seg">${Object.entries(d.units).map(([k, v]) => `<label><input type="radio" name="unit" value="${k}" ${k === cur ? "checked" : ""}><span>${v}</span></label>`).join("")}</div>
      <div class="urow"><select data-u="one" aria-label="大問の数">${Array.from({ length: 10 }, (_, i) => i + 1).map(i => `<option value="${i}" ${i === (keep.one || 5) ? "selected" : ""}>${i}</option>`).join("")}</select><small>大問（足りないときは、その単元の大問をすべて使います）</small></div>`;
  }
  document.querySelectorAll("#units .urow").forEach(row => {
    const cb = row.querySelector("input[type=checkbox]"), sel = row.querySelector("select");
    if (!cb) return;
    cb.onchange = () => { sel.value = cb.checked ? String(Math.min(defOf(cb.value, 0) || 3, maxOf(cb.value))) : "0"; make(curSeed()); };
    sel.onchange = () => { cb.checked = +sel.value > 0; make(curSeed()); };
  });
  if (!$("title").dataset.edited) $("title").value = m === "term" ? "2学期 中間テスト" : "単元テスト";
}

function allot(items) {
  const w = items.map(it => it.w || WEIGHT[it.type]), sum = w.reduce((a, b) => a + b, 0);
  const raw = w.map(x => x * 100 / sum), pts = raw.map(Math.floor);
  let rest = 100 - pts.reduce((a, b) => a + b, 0);
  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { pts[i]++; rest--; } });
  items.forEach((it, i) => it.pts = pts[i]);
}

function build(seed) {
  const r = rng(seed), d = data(), m = mode();
  const order = Object.keys(d.units);
  let want = [];
  if (m === "unit") {
    const u = document.querySelector("input[name=unit]:checked").value;
    want = [[u, Math.min(+document.querySelector("#units select").value, (d.unitMax || {})[u] ?? 99)]];
  } else {
    want = [...document.querySelectorAll("#units select")].map(x => [x.dataset.u, +x.value]).filter(([, n]) => n > 0);
  }
  if (!want.length) { alert("大問の数を1以上にした単元を、1つ以上選んでください。"); return null; }
  let chosen = [];
  for (const [u, n] of want) {
    let p = shuffleR(pool(u), r);
    if (lv() === 0) { const a = p.filter(t => t.lv === 2), b = p.filter(t => t.lv !== 2); p = []; while (a.length || b.length) { if (a.length) p.push(a.shift()); if (b.length) p.push(b.shift()); } }
    // 同じ group の大問は1つのテストに1つだけ（リスニングの大問1・大問2など）
    const seen = new Set(), q = [];
    for (const t of p) { if (t.group && seen.has(t.group)) continue; if (t.group) seen.add(t.group); q.push(t); }
    chosen.push(...q.slice(0, n));
  }
  chosen.sort((a, b) => order.indexOf(a.unit) - order.indexOf(b.unit) || (a.rank || 0) - (b.rank || 0) || (a.lv || 1) - (b.lv || 1));
  const per = +document.querySelector("input[name=per]:checked").value;
  const dqs = chosen.map(t => {
    const g = t.f(r);
    let keep = g.items.map((it, i) => i);
    if (keep.length > per && !g.keepAll) keep = shuffleR(keep, r).slice(0, per).sort((a, b) => a - b);
    g.items = keep.map(i => g.items[i]);
    if (g.script && g.script.length === keep.length && g.items.length < g.script.length) g.script = keep.map(i => g.script[i]);
    return g;
  });
  allot(dqs.flatMap(g => g.items));
  const units = [...new Set(chosen.map(t => t.unit))];
  return { seed, tate: !!d.tate, title: $("title").value || "テスト", name: d.name, grade: d.grade || 1, minutes: d.minutes || 50, units: units.map(u => d.units[u]), dqs, mode: m };
}

const choicesHtml = it => it.pics ? `<div class="ch pics">${it.pics.join("")}</div>` : it.choices ? `<div class="ch${it.choices.every(c => c.length <= 18) ? " two" : ""}">${it.choices.map(c => `<span>${it.chHtml ? c : esc(c)}</span>`).join("")}</div>` : "";
const qText = it => it.qHtml || esc(it.q);

function scriptHtml(T) {
  let no = 0;
  const parts = T.dqs.map((g, gi) => g.script ? `<section class="dq script"><h3><span class="num">${gi + 1}</span>${esc(g.title)}</h3>${(g.scriptIntro ? `<p class="say ja">${esc(g.scriptIntro)}</p>` : "")}${g.script.map(b => `<p class="say ja"><b>${esc(b.title)}</b></p>${b.lines.map(l => l.chime ? `<p class="say pause">（チャイム音）</p>` : `<p class="say en">${l.who ? `<b>${esc(l.who)}:</b> ` : ""}${esc(l.en)}</p>${l.pause ? `<p class="say pause">（2回目のあと、${l.pause}秒ほど間をとる）</p>` : ""}`).join("")}<p class="say pause">（2回くり返す）</p>`).join("")}</section>` : "").join("");
  return parts;
}

function render(T) {
  const nItems = T.dqs.reduce((a, g) => a + g.items.length, 0);
  $("summary").textContent = `テスト番号 ${T.seed}　／　大問 ${T.dqs.length}・小問 ${nItems}・100点　／　出題範囲：${T.units.join("、")}`;
  const head = (label) => `<h2>${esc(T.title)}　${T.name}${label}</h2><p class="sub">出題範囲：${esc(T.units.join("、"))}　／　${T.minutes}分　／　100点</p>`;
  const nameBar = `<div class="namebar"><div><b>年</b>${T.grade}年</div><div><b>組・番</b>　組　　番</div><div><b>氏名</b></div><div><b>得点</b>　　　／100</div></div>`;
  const qHtml = T.dqs.map((g, gi) => `<section class="dq"><h3><span class="num">${gi + 1}</span>${esc(g.title)}<span class="pts">（${g.items.reduce((a, it) => a + it.pts, 0)}点）</span></h3>
    <div class="intro">${g.script ? `<p class="listen-note">放送を聞いて答える問題です。英文はそれぞれ2回読まれます。放送中にメモをとってもかまいません。</p>` : ""}<div class="lead">${g.lead}</div>${g.fig ? `<div class="fig">${g.fig}</div>` : ""}</div>
    <ol class="items">${g.items.map((it, i) => `<li><span class="n">(${i + 1})</span><div>${qText(it)}${it.type === "order" ? "（記号で答えなさい）" : ""}${choicesHtml(it)}</div></li>`).join("")}</ol></section>`).join("");
  let html = T.tate ? `<div id="tateHost"></div>` : `<article class="sheet">${head("")}${nameBar}${qHtml}<p class="foot">クロ先生のAI職員室　定期テスト自動作成　テスト番号 ${T.seed}</p></article>`;
  if ($("optSheet").checked) {
    html += `<article class="sheet">${head("　解答用紙")}${nameBar}${T.dqs.map((g, gi) => `<p class="ans-head">${gi + 1}　${esc(g.title)}</p><div class="ans-grid">${g.items.map((it, i) => `<div class="cell${it.type === "desc" || it.wide || (it.type === "word" && it.ans.length > 14) ? " wide" : ""}${it.essay ? " essay" : ""}"><span>(${i + 1})</span><span class="p">${it.pts}点</span>${it.essay ? genko() : ""}</div>`).join("")}</div>`).join("")}<p class="foot">テスト番号 ${T.seed}</p></article>`;
  }
  if ($("optKey").checked) {
    html += `<article class="sheet key">${head("　解答・解説")}${T.dqs.map((g, gi) => `<section class="dq"><h3><span class="num">${gi + 1}</span>${esc(g.title)}<span class="pts">（${g.items.reduce((a, it) => a + it.pts, 0)}点）</span></h3><ol class="items">${g.items.map((it, i) => `<li><span class="n">(${i + 1})</span><div><span class="a">${esc(it.ans)}</span>　<small>［${it.pts}点］</small>${it.crit ? `<div class="c">採点の目安：${esc(it.crit)}</div>` : ""}${it.ex ? `<div class="x">${esc(it.ex)}</div>` : ""}</div></li>`).join("")}</ol></section>`).join("")}<p class="foot">テスト番号 ${T.seed}</p></article>`;
  }
  const sc = scriptHtml(T);
  if (sc) html += `<article class="sheet">${head("　リスニング放送台本")}<p class="listen-note">先生用です。下の「放送する」ボタンでパソコンに読み上げさせることもできます（英語の音声が入っている端末で動きます）。読み上げのかわりに、先生が台本を2回ずつ読んでもかまいません。</p>${sc}<p class="foot">テスト番号 ${T.seed}</p></article>`;
  $("out").innerHTML = html;
  // 縦書きの教科は、印刷をすべて A4 横にする（Chrome は1ページ目の幅で全体の縮小率を決めるため）
  let ts = $("tateStyle"); if (!ts) { ts = document.createElement("style"); ts.id = "tateStyle"; document.head.append(ts); }
  ts.textContent = T.tate ? "@media print { @page { size: A4 landscape; margin: 12mm; } .sheet { max-width: 273mm !important; } }" : "";
  if (T.tate) tateRender(T);
  setupPlayer(T);
}

/* ---------- 国語：縦書きの問題用紙（A4横のページに、ブロックを右から順につめていく） ---------- */
function tcyText(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest("svg, .horiz") ? NodeFilter.FILTER_REJECT : /[0-9A-Za-z]/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  for (const n of list) {
    const frag = document.createDocumentFragment();
    n.nodeValue.split(/([0-9]{1,2}(?![0-9])|[0-9]{3,}|[A-Za-z]+)/).forEach((t, i) => {
      if (!t) return;
      if (i % 2) { const sp = document.createElement("span"); sp.className = /^[0-9]{1,2}$/.test(t) ? "tcy" : "upr"; sp.textContent = t; frag.append(sp); }
      else frag.append(t);
    });
    n.replaceWith(frag);
  }
}
function tateBlocks(T) {
  const B = [];
  const vname = `<div class="vname"><div>${T.grade}年　　組　　番</div><div class="nm">氏名</div><div>得点　　　／100</div></div>`;
  B.push(`<div class="thead"><h2>${esc(T.title)}　${T.name}</h2></div>`, `<p class="sub">${T.minutes}分　／　100点</p>`, vname);
  T.dqs.forEach((g, gi) => {
    B.push(`<h3 class="th"><span class="num">${gi + 1}</span>${esc(g.title)}<span class="pts">（${g.items.reduce((a, it) => a + it.pts, 0)}点）</span></h3>`);
    const tmp = document.createElement("div"); tmp.innerHTML = g.lead;
    let buf = "";
    const flush = () => { if (buf.trim()) B.push(`<div class="tlead">${buf}</div>`); buf = ""; };
    for (const nd of [...tmp.childNodes]) {
      if (nd.nodeType === 1 && nd.classList.contains("passage") && !nd.classList.contains("kanshi")) {
        flush();
        const ps = [...nd.querySelectorAll("p")];
        ps.forEach((p, i) => B.push(`<div class="tp${p.querySelector(".pn") ? "" : ""}${i === 0 ? " tpbox-start" : ""}${i === ps.length - 1 ? " tpbox-end" : ""}">${p.innerHTML}</div>`));
      } else if (nd.nodeType === 1 && nd.classList.contains("kanshi")) { flush(); B.push(nd.outerHTML); }
      else if (nd.nodeType === 1 && nd.classList.contains("chu")) { flush(); B.push(nd.outerHTML); }
      else buf += nd.nodeType === 1 ? nd.outerHTML : esc(nd.nodeValue);
    }
    flush();
    if (g.fig) B.push(`<div class="horiz">${g.fig}</div>`);
    g.items.forEach((it, i) => B.push(`<div class="titem"><span class="n">（${i + 1}）</span><div>${qText(it)}${it.choices ? `<div class="ch">${it.choices.map(c => `<span>${it.chHtml ? c : esc(c)}</span>`).join("")}</div>` : ""}</div></div>`));
  });
  return B;
}
function tateRender(T) {
  const host = $("tateHost"), blocks = tateBlocks(T);
  let page = null;
  const newPage = () => { const a = document.createElement("article"); a.className = "sheet tate"; page = document.createElement("div"); page.className = "tpage"; a.append(page); host.append(a); return page; };
  newPage();
  for (const h of blocks) {
    const t = document.createElement("div"); t.innerHTML = h; const node = t.firstElementChild || t;
    tcyText(node);
    page.append(node);
    if (page.scrollWidth > page.clientWidth + 1 && page.children.length > 1) { node.remove(); newPage(); page.append(node); }
  }
  const pages = host.querySelectorAll(".tpage");
  pages.forEach((p, i) => { const f = document.createElement("p"); f.className = "foot"; f.textContent = `テスト番号 ${T.seed}　（${i + 1}／${pages.length}）`; p.append(f); if (p.scrollWidth > p.clientWidth + 1) f.remove(); });
}

/* ---------- リスニングの読み上げ（Web Speech API） ---------- */
let speakQ = [], speaking = false;
function voices() { const v = speechSynthesis.getVoices(); return { en: v.filter(x => /^en[-_]US/i.test(x.lang)).concat(v.filter(x => /^en/i.test(x.lang) && !/^en[-_]US/i.test(x.lang))), ja: v.filter(x => /^ja/i.test(x.lang)) }; }
// 話し手の性別（名前・役から判断）。女性は高め、男性は低めの声にし、男女で別の音声を選ぶ
const FEM = /^(Woman|Girl|Mother|Mom|Ms|Mrs|Emily|Lisa|Kate|Meg|Amy|Saki|Yuki|Aya|Mika|Emi)\b/;
const VF = /Zira|Samantha|Female|Google US English|Aria|Jenny|Susan|Karen|Moira|Tessa|Victoria|Allison|Ava|Serena|Kyoko|Haruka|Ayumi|Nanami/i;
const VM = /David|Mark|Alex|Fred|Male|Guy|Daniel|Aaron|Tom|Rishi|Ichiro|Keita|Otoya/i;
// idx：その対話で何人目の話し手か。同じ性別の2人目は別の音声・高さにして聞き分けられるようにする
function pickVoice(list, fem, idx) {
  const want = list.filter(x => (fem ? VF : VM).test(x.name) && !(fem ? VM : VF).test(x.name));
  if (want.length) return want[idx % want.length];
  return list.length > 1 ? list[fem ? 0 : 1] : list[0];
}
function utter(text, lang, who, rate, idx = 0) {
  return new Promise(ok => {
    const u = new SpeechSynthesisUtterance(text), V = voices();
    u.lang = lang === "en" ? "en-US" : "ja-JP"; u.rate = lang === "en" ? rate : 1;
    const list = lang === "en" ? V.en : V.ja;
    const fem = who ? FEM.test(who) : false;
    if (list.length) u.voice = who ? pickVoice(list, fem, idx) : list[0];
    if (lang === "en" && who) u.pitch = fem ? (idx % 2 ? 1.05 : 1.25) : (idx % 2 ? 1.0 : 0.8);
    u.onend = u.onerror = () => ok(); speechSynthesis.speak(u);
  });
}
// チャイム（ピンポーン）を Web Audio で鳴らす
function chime() {
  return new Promise(ok => {
    try {
      const C = window.AudioContext || window.webkitAudioContext; const ac = new C();
      [[784, 0], [622, 0.45]].forEach(([f, t]) => {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(0.35, ac.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 1.1);
        o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 1.2);
      });
      setTimeout(() => { ac.close(); ok(); }, 1700);
    } catch (e) { ok(); }
  });
}
// 台本の見出し「(1)」は「1番」と読む
const sayTitle = t => t.replace(/^\((\d+)\)$/, "$1番").replace(/^No\.\s*(\d+)$/, "$1番");
const wait = s => new Promise(ok => setTimeout(ok, s * 1000));
async function play(T, only) {
  if (!("speechSynthesis" in window)) { alert("このブラウザでは読み上げが使えません。台本を先生が読んでください。"); return; }
  speechSynthesis.cancel(); speaking = true;
  const rate = +$("rate").value;
  for (const [gi, g] of T.dqs.entries()) {
    if (!g.script || (only != null && only !== gi)) continue;
    $("now").textContent = `大問${gi + 1} を放送中`;
    await utter(`これから、大問${gi + 1}の問題を始めます。英文はそれぞれ2回読まれます。`, "ja"); if (!speaking) return; await wait(1);
    for (const b of g.script) {
      for (let rep = 0; rep < 2; rep++) {
        if (!speaking) return;
        const tt = sayTitle(b.title || "");
        if (tt || rep) { await utter((tt ? tt + "。" : "") + (rep ? "もう一度読みます。" : ""), "ja"); await wait(0.6); }
        const sex = {}, cnt = { f: 0, m: 0 };
        for (const l of b.lines) if (l.who && !(l.who in sex)) { const g = FEM.test(l.who) ? "f" : "m"; sex[l.who] = cnt[g]++; }
        for (const l of b.lines) {
          if (!speaking) return;
          if (l.chime) { await chime(); await wait(rep ? 1 : 0.5); continue; }
          await utter(l.en, "en", l.who, rate, l.who ? sex[l.who] : 0); await wait(l.pause && rep ? l.pause : 0.5);
        }
        await wait(rep ? 5 : 2.5);
      }
    }
  }
  $("now").textContent = speaking ? "放送が終わりました" : ""; speaking = false;
}
function setupPlayer(T) {
  const has = T.dqs.map((g, i) => g.script ? i : -1).filter(i => i >= 0);
  if (!has.length) { $("player").hidden = true; return; }
  $("player").hidden = false;
  $("player").innerHTML = `<p><b>リスニングの放送</b>　パソコンのスピーカーで読み上げます（英文はそれぞれ2回）。印刷物には入りません。</p>
    <div class="btns">${has.map(i => `<button class="btn" type="button" data-p="${i}">大問${i + 1} を放送する</button>`).join("")}<button class="btn main" type="button" data-p="all">リスニングをすべて放送</button><button class="btn" type="button" data-p="stop">止める</button>
    <label style="font-size:13px">速さ <select id="rate"><option value="0.8">ゆっくり</option><option value="0.9" selected>ふつう</option><option value="1">はやめ</option></select></label></div><p class="now" id="now"></p>`;
  $("player").querySelectorAll("button").forEach(b => b.onclick = () => { const p = b.dataset.p; if (p === "stop") { speaking = false; speechSynthesis.cancel(); $("now").textContent = "止めました"; return; } play(T, p === "all" ? null : +p); });
}

function make(seed) { const T = build(seed); if (T) { $("seed").value = seed; render(T); } }
const newSeed = () => 10000 + Math.floor(Math.random() * 89999);
const curSeed = () => Number($("seed").value) || newSeed();

document.querySelectorAll("input[name=subj]").forEach(x => x.onchange = async () => {
  try { await loadSubj(subjKey()); } catch (e) { alert("問題データを読みこめませんでした。通信状態を確かめてください。"); return; }
  if (window.speechSynthesis) { speaking = false; speechSynthesis.cancel(); }
  renderUnits(true); make(newSeed());
});
document.querySelectorAll("input[name=mode]").forEach(x => x.onchange = () => { renderUnits(); make(newSeed()); });
document.querySelectorAll("input[name=lv]").forEach(x => x.onchange = () => { renderUnits(); make(curSeed()); });
document.querySelectorAll("input[name=per]").forEach(x => x.onchange = () => make(curSeed()));
$("units").addEventListener("change", e => { if (mode() === "unit" && (e.target.name === "unit" || e.target.tagName === "SELECT")) make(curSeed()); });
$("make").onclick = () => make(curSeed());
$("remake").onclick = () => make(newSeed());
$("print").onclick = () => window.print();
$("title").addEventListener("input", () => $("title").dataset.edited = "1");
$("optSheet").onchange = $("optKey").onchange = $("title").oninput = () => make(curSeed());
if (window.speechSynthesis) speechSynthesis.getVoices();
renderUnits();
make(newSeed());
</script>
