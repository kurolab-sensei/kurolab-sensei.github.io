<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/favicon.png">
<meta name="description" content="60秒で何問解ける？中学生向けの一問一答タイムアタック。数学・英語・理科・社会の中1〜中3、48単元。まちがえた問題は解説つき。ログイン不要。">
<title>一問一答タイムアタック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one chalkboard column like the other games. Screens: pick a subject → 60s run → results with a review list. */
:root {
  --board: #1f4a3c;
  --board-deep: #173a2f;
  --chalk: #f3f1e7;
  --chalk-dim: #b9c7bd;
  --gold: #e8b64c;
  --red: #ff7a6b;
  --ok: #8fd8a8;
  --wood: #6b4a2f;
  --f-chalk: "Klee One", "Hiragino Mincho ProN", serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--board-deep); margin: 0; }
body {
  color: var(--chalk);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.back { color: var(--chalk-dim); font-size: 14px; text-decoration: none; }
.back:hover { color: var(--chalk); }
.board {
  background:
    radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(90% 60% at 90% 100%, rgba(0,0,0,.18), transparent 70%),
    var(--board);
  border: 10px solid var(--wood);
  border-radius: 6px;
  box-shadow: inset 0 0 40px rgba(0,0,0,.25), 0 6px 0 #4b3320;
  padding: 20px 18px 22px;
  display: grid;
  gap: 16px;
  min-width: 0;
}
header.top { display: flex; align-items: center; gap: 14px; }
header.top img { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--gold); flex: none; }
header.top h1 { font-family: var(--f-chalk); font-weight: 600; font-size: clamp(24px, 6vw, 32px); line-height: 1.25; margin: 0; }
header.top p { margin: 2px 0 0; color: var(--chalk-dim); font-size: 13px; }

.subjects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.subj {
  font: inherit; color: var(--chalk); text-align: left; cursor: pointer;
  background: rgba(0,0,0,.18); border: 2px solid rgba(243,241,231,.35); border-radius: 10px;
  padding: 12px; display: grid; gap: 2px; min-width: 0;
}
.subj:hover { border-color: var(--gold); }
.subj:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.subj b { font-family: var(--f-chalk); font-size: 22px; }
.subj span { font-size: 12px; color: var(--chalk-dim); }
.subj em { font-style: normal; font-size: 12px; color: var(--gold); }
.rule { margin: 0; font-size: 14px; color: var(--chalk-dim); }

.hud { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hud .score { font-family: var(--f-chalk); font-size: 28px; font-weight: 600; }
.hud .combo { font-size: 14px; color: var(--gold); min-height: 1.5em; }
.timebar { height: 10px; border-radius: 999px; background: rgba(0,0,0,.3); overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: var(--chalk); transform-origin: left; }
.timebar.low i { background: var(--red); }
.unit { font-size: 12px; color: var(--chalk-dim); margin: 0; }
.q { font-family: var(--f-chalk); font-weight: 600; font-size: clamp(22px, 6vw, 30px); line-height: 1.45; margin: 0; min-height: 2.9em; display: flex; align-items: center; overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  font: inherit; font-size: 20px; font-weight: 700; color: var(--ink, #23302a); cursor: pointer;
  background: var(--chalk); border: 0; border-radius: 10px; padding: 14px 8px; min-height: 64px;
  box-shadow: 0 4px 0 #b9b39c; touch-action: manipulation; overflow-wrap: anywhere;
}
.opt:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9b39c; }
.opt.ok { background: var(--ok); }
.opt.ng { background: var(--red); }
.flash { text-align: center; font-weight: 700; min-height: 1.6em; margin: 0; }
.flash.ok { color: var(--ok); }
.flash.ng { color: var(--red); }

.result { display: grid; gap: 12px; text-align: center; }
.result .big { font-family: var(--f-chalk); font-size: 56px; font-weight: 600; line-height: 1.1; margin: 0; }
.result .rank { font-size: 20px; font-weight: 700; color: var(--gold); margin: 0; }
.result .meta { margin: 0; color: var(--chalk-dim); font-size: 14px; }
.result .new { color: var(--gold); font-weight: 700; margin: 0; }
.say { background: var(--chalk); color: #23302a; border-radius: 12px; padding: 10px 14px; text-align: left; margin: 0; font-size: 15px; }
.review { text-align: left; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.review li { background: rgba(0,0,0,.18); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.review li b { color: var(--ok); }
.review li small { display: block; color: var(--chalk-dim); font-size: 13px; margin-top: 2px; }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 10px 22px; border: 2px solid var(--chalk); background: transparent; color: var(--chalk); }
.btn.main { background: var(--gold); border-color: var(--gold); color: #23302a; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tab { font: inherit; font-family: var(--f-chalk); font-size: 18px; font-weight: 600; cursor: pointer; color: var(--chalk); background: rgba(0,0,0,.18); border: 2px solid rgba(243,241,231,.3); border-radius: 10px; padding: 6px 0; }
.tab[aria-selected="true"] { background: var(--chalk); color: #23302a; border-color: var(--chalk); }
.grades { display: flex; gap: 6px; flex-wrap: wrap; }
.grade { font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--chalk-dim); background: transparent; border: 1.5px solid rgba(243,241,231,.35); border-radius: 999px; padding: 2px 12px; }
.grade[aria-pressed="true"] { color: #23302a; background: var(--gold); border-color: var(--gold); }
.tab:focus-visible, .grade:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.mixrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.subj .gb { display: inline-block; font-size: 11px; font-weight: 700; color: #23302a; background: var(--chalk-dim); border-radius: 4px; padding: 0 6px; margin-right: 6px; vertical-align: 2px; }
.subj.mix { border-style: dashed; }
.subj b.sm { font-size: 18px; }
.stat { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 13px; color: var(--chalk-dim); margin: 0; }
.hud .time { font-family: var(--f-chalk); font-size: 20px; color: var(--chalk-dim); }
.count { font-family: var(--f-chalk); font-size: 96px; font-weight: 600; text-align: center; margin: 40px 0; line-height: 1; }
.opts.three .opt:last-child { grid-column: 1 / -1; }
.combo.hot { color: var(--red); }
.review li.hd { background: none; padding: 0; font-weight: 700; color: var(--chalk); }
footer { font-size: 12px; color: var(--chalk-dim); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← クロ先生のAI職員室へ</a>

  <section class="board" id="home">
    <header class="top">
      <img src="../assets/kuro.jpg" alt="クロ先生" width="60" height="60">
      <div>
        <h1><span style="display:inline-block">一問一答</span><span style="display:inline-block">タイムアタック</span></h1>
        <p>60秒で、何問解ける？</p>
      </div>
    </header>
    <p class="rule">教科と単元を選ぶと、3秒後にスタート。連続正解でコンボ加点、まちがえると3秒へります。終わったら、まちがえた問題をクロ先生が解説します。</p>
    <p class="stat" id="stat"></p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="grades" id="grades"></div>
    <div class="mixrow" id="mixrow"></div>
    <div class="subjects" id="subjects"></div>
  </section>

  <section class="board" id="ready" hidden>
    <p class="unit" id="readyUnit" style="text-align:center"></p>
    <p class="count" id="count">3</p>
  </section>

  <section class="board" id="play" hidden>
    <div class="hud">
      <span class="score" id="score">0</span>
      <span class="combo" id="combo"></span>
      <span class="time" id="time">60</span>
    </div>
    <div class="timebar" id="timebar"><i id="timefill"></i></div>
    <p class="unit" id="unit"></p>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <p class="flash" id="flash" aria-live="polite"></p>
  </section>

  <section class="board" id="end" hidden>
    <div class="result">
      <p class="meta" id="endSubj"></p>
      <p class="big" id="endScore">0</p>
      <p class="rank" id="endRank"></p>
      <p class="meta" id="endMeta"></p>
      <p class="new" id="endNew" hidden>自己ベスト更新！</p>
      <p class="say" id="endSay"></p>
      <ul class="review" id="review"></ul>
      <div class="btns">
        <button class="btn main" id="again">もう一回</button>
        <button class="btn" id="toHome">教科をえらぶ</button>
      </div>
    </div>
  </section>

  <footer>記録はこの端末の中だけに保存されます。名前や成績は集めません。</footer>
</div>

<script src="time-attack-data.js"></script>
<script>
const $ = id => document.getElementById(id);
const { UNITS, pick } = window.TA;
const SUBJ = { math: "数学", eng: "英語", sci: "理科", soc: "社会" };
const unitById = id => UNITS.find(u => u.id === id);
function modeOf(key) {
  if (key === "all") return { name: "4教科ミックス", gens: UNITS.flatMap(u => u.gen) };
  if (key.startsWith("mix-")) { const sj = key.slice(4); return { name: SUBJ[sj] + "ミックス", gens: UNITS.filter(u => u.subj === sj).flatMap(u => u.gen) }; }
  const u = unitById(key); return { name: SUBJ[u.subj] + "・中" + u.grade + "　" + u.name, gens: u.gen };
}
let tab = "math", gradeF = 0;
try { const v = JSON.parse(localStorage.getItem("kurolab-time-attack-ui") || "{}"); if (SUBJ[v.tab]) tab = v.tab; if ([0, 1, 2, 3].includes(v.grade)) gradeF = v.grade; } catch (e) {}
const saveUi = () => { try { localStorage.setItem("kurolab-time-attack-ui", JSON.stringify({ tab, grade: gradeF })); } catch (e) {} };

const KEY = "kurolab-time-attack-v1";
let best = {};
try { best = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { best = {}; }
const saveBest = () => { try { localStorage.setItem(KEY, JSON.stringify(best)); } catch (e) {} };

const LIMIT = 60000, PENALTY = 3000;
let S = null, timer = 0, cdTimer = 0;

function show(id) { for (const s of ["home", "ready", "play", "end"]) $(s).hidden = s !== id; window.scrollTo({ top: 0 }); }
function btn(cls, html, onclick) { const b = document.createElement("button"); b.className = cls; b.innerHTML = html; b.onclick = onclick; return b; }
const bestTxt = k => best[k] ? "ベスト " + best[k] + "点" : "まだ記録なし";

function renderHome() {
  let qTypes = 0; for (const u of UNITS) qTypes += u.gen.length;
  $("stat").textContent = "4教科・" + UNITS.length + "単元・問題パターン" + qTypes + "種類（計算問題は毎回ちがう数字が出ます）";
  $("tabs").innerHTML = "";
  for (const [k, v] of Object.entries(SUBJ)) {
    const t = btn("tab", v, () => { tab = k; saveUi(); renderHome(); });
    t.setAttribute("role", "tab"); t.setAttribute("aria-selected", String(k === tab));
    $("tabs").append(t);
  }
  $("grades").innerHTML = "";
  [[0, "全学年"], [1, "中1"], [2, "中2"], [3, "中3"]].forEach(([g, l]) => {
    const b = btn("grade", l, () => { gradeF = g; saveUi(); renderHome(); });
    b.setAttribute("aria-pressed", String(g === gradeF));
    $("grades").append(b);
  });
  $("mixrow").innerHTML = "";
  $("mixrow").append(
    btn("subj mix", "<b class='sm'>" + SUBJ[tab] + "ミックス</b><span>" + SUBJ[tab] + "の全単元から</span><em>" + bestTxt("mix-" + tab) + "</em>", () => ready("mix-" + tab)),
    btn("subj mix", "<b class='sm'>4教科ミックス</b><span>全" + UNITS.length + "単元から</span><em>" + bestTxt("all") + "</em>", () => ready("all")));
  $("subjects").innerHTML = "";
  for (const u of UNITS.filter(u => u.subj === tab && (!gradeF || u.grade === gradeF)))
    $("subjects").append(btn("subj", "<b class='sm'><span class='gb'>中" + u.grade + "</span>" + u.name + "</b><em>" + bestTxt(u.id) + "</em>", () => ready(u.id)));
  show("home");
}

const SEEN = "kurolab-time-attack-seen";
function loadSeen(key) { try { return (JSON.parse(localStorage.getItem(SEEN) || "{}")[key]) || []; } catch (e) { return []; } }
function saveSeen(key, list) { try { const all = JSON.parse(localStorage.getItem(SEEN) || "{}"); all[key] = list.slice(-80); localStorage.setItem(SEEN, JSON.stringify(all)); } catch (e) {} }

function ready(key) {
  const m = modeOf(key);
  S = { key, gens: m.gens, name: m.name, score: 0, combo: 0, maxCombo: 0, right: 0, wrong: 0, missed: [], over: false, used: new Set(), recent: new Set(loadSeen(key)), seenNow: [] };
  $("readyUnit").textContent = m.name;
  show("ready");
  let n = 3; $("count").textContent = n;
  clearInterval(cdTimer);
  cdTimer = setInterval(() => { n--; if (n > 0) $("count").textContent = n; else { clearInterval(cdTimer); start(); } }, 700);
}

function nextQ() {
  // 同じ回の中では同じ問題を出さない。前の回に出た問題もなるべく避ける。
  let q, tries = 0;
  do { q = pick(S.gens)(); tries++; } while ((S.used.has(q.q) || (tries < 40 && S.recent.has(q.q))) && tries < 80);
  if (S.used.has(q.q)) S.used.clear();
  S.used.add(q.q); S.cur = q;
  S.seenNow.push(q.q); S.locked = false; S.shown = performance.now();
  $("unit").textContent = q.unit;
  $("q").textContent = q.q;
  $("opts").innerHTML = "";
  $("opts").classList.toggle("three", q.opts.length === 3);
  q.opts.forEach(o => { const b = btn("opt", "", () => answer(b, o)); b.textContent = o; $("opts").append(b); });
}

function answer(b, o) {
  if (S.locked || S.over) return;
  S.locked = true;
  const q = S.cur, ok = o === q.ans;
  if (ok) {
    S.combo++; S.right++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    const fast = performance.now() - S.shown < 2500 ? 3 : 0;
    const gain = 10 + Math.min(S.combo - 1, 5) * 2 + fast;
    S.score += gain;
    b.classList.add("ok");
    $("flash").className = "flash ok"; $("flash").textContent = "せいかい！ +" + gain + (fast ? "（はやい！）" : "");
  } else {
    S.combo = 0; S.wrong++;
    S.end -= PENALTY;
    S.missed.push(q);
    b.classList.add("ng");
    for (const x of $("opts").children) if (x.textContent === q.ans) x.classList.add("ok");
    $("flash").className = "flash ng"; $("flash").textContent = "ざんねん　−3秒";
  }
  $("score").textContent = S.score;
  $("combo").textContent = S.combo >= 2 ? S.combo + " コンボ！" : "";
  $("combo").classList.toggle("hot", S.combo >= 6);
  setTimeout(() => { if (!S.over) nextQ(); }, ok ? 250 : 1000);
}

function tick() {
  if (!S || S.over) return;
  const left = S.end - performance.now();
  $("timefill").style.transform = "scaleX(" + Math.max(0, left / LIMIT) + ")";
  $("timebar").classList.toggle("low", left < 10000);
  $("time").textContent = Math.max(0, Math.ceil(left / 1000));
  if (left <= 0) return finish();
  timer = requestAnimationFrame(tick);
}

function start() {
  S.end = performance.now() + LIMIT;
  $("score").textContent = "0"; $("combo").textContent = ""; $("flash").textContent = "";
  show("play");
  nextQ();
  cancelAnimationFrame(timer);
  timer = requestAnimationFrame(tick);
}

const RANKS = [[400, "職員室の伝説", "ここまで来るとクロ先生もびっくりです。友だちに挑戦状を出してみましょう。"], [280, "学年トップクラス", "スピードも正確さも十分。コンボを切らさないのが次の課題です。"], [160, "なかなかの実力", "いい調子です。まちがえた問題を見直すと、すぐに点が伸びます。"], [80, "準備運動完了", "慣れると一気に伸びます。下のまちがい直しを読んでから、もう一回。"], [0, "まずは一歩", "最初はみんなこんなものです。ゆっくりでも正解を重ねるとコンボになります。"]];

function finish() {
  S.over = true;
  cancelAnimationFrame(timer);
  saveSeen(S.key, [...loadSeen(S.key), ...S.seenNow]);
  const k = S.key, isNew = S.score > (best[k] || 0);
  if (isNew) { best[k] = S.score; saveBest(); }
  const [, rank, say] = RANKS.find(r => S.score >= r[0]);
  const n = S.right + S.wrong, acc = n ? Math.round(S.right / n * 100) : 0;
  $("endSubj").textContent = S.name + "の結果";
  $("endScore").textContent = S.score + "点";
  $("endRank").textContent = rank;
  $("endMeta").textContent = "正解 " + S.right + "問 ／ まちがい " + S.wrong + "問 ／ 正答率 " + acc + "% ／ 最大 " + S.maxCombo + "コンボ ／ ベスト " + best[k] + "点";
  $("endNew").hidden = !(isNew && S.score > 0);
  $("endSay").textContent = "クロ先生：" + (S.wrong === 0 && S.right > 0 ? "まちがいゼロ！すばらしい。次はスピードを上げてコンボを伸ばしましょう。" : say);
  $("review").innerHTML = "";
  const seen = new Set();
  if (S.missed.length) { const h = document.createElement("li"); h.className = "hd"; h.textContent = "まちがい直し（クロ先生の解説つき）"; $("review").append(h); }
  for (const q of S.missed) {
    if (seen.has(q.q)) continue; seen.add(q.q);
    const li = document.createElement("li");
    li.append(q.q.replace(/は？$/, "").replace(/[　 ]*[＝=]?[　 ]*？$/, "") + "　→　");
    const b = document.createElement("b"); b.textContent = q.ans; li.append(b);
    if (q.ex) { const p = document.createElement("small"); p.textContent = "クロ先生：" + q.ex; li.append(p); }
    $("review").append(li);
  }
  show("end");
}

$("again").onclick = () => ready(S.key);
$("toHome").onclick = renderHome;
document.addEventListener("keydown", e => {
  if ($("play").hidden || !S || S.locked) return;
  const i = "1234".indexOf(e.key);
  if (i >= 0) { const b = $("opts").children[i]; if (b) b.click(); }
});
renderHome();
</script>
</body>
</html>
