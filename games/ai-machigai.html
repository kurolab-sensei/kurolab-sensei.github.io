<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../assets/favicon.png">
<meta name="description" content="AIの説明文にまざったまちがいを見抜く、中学生向けの無料ゲーム。ログイン不要。">
<title>AIのまちがい探し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one chalkboard column; the AI answer is a speech bubble whose sentences are tappable chalk strips. Single deliberate look (classroom board), not theme-switched. */
:root {
  --board: #1f4a3c;       /* 黒板の緑 */
  --board-deep: #173a2f;
  --chalk: #f3f1e7;       /* チョークの白 */
  --chalk-dim: #b9c7bd;
  --gold: #e8b64c;        /* クロ先生のメガネ */
  --red: #ff7a6b;         /* 赤ペン */
  --ok: #8fd8a8;
  --wood: #6b4a2f;
  --paper: #fbfaf4;
  --ink: #23302a;
  --f-chalk: "Klee One", "Hiragino Mincho ProN", serif;
  --f-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--board-deep); }
body {
  color: var(--chalk);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 18px; }

.board {
  background:
    radial-gradient(120% 80% at 20% 0%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(90% 60% at 90% 100%, rgba(0,0,0,.18), transparent 70%),
    var(--board);
  border: 10px solid var(--wood);
  border-radius: 6px;
  box-shadow: inset 0 0 40px rgba(0,0,0,.25), 0 6px 0 #4b3320;
  padding: 20px 18px 22px;
  display: grid;
  gap: 16px;
  min-width: 0;
}
header.top { display: flex; align-items: center; gap: 14px; }
header.top img { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--gold); flex: none; }
header.top h1 { font-family: var(--f-chalk); font-weight: 600; font-size: clamp(24px, 6vw, 32px); line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: .02em; }
header.top p { margin: 2px 0 0; color: var(--chalk-dim); font-size: 13px; }

.hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--chalk-dim); }
.dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--chalk-dim); }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.dot.ng { background: var(--red); border-color: var(--red); }
.dot.now { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(232,182,76,.35); }
.subject { font-family: var(--f-chalk); color: var(--gold); font-weight: 600; font-size: 15px; }

.ask { font-family: var(--f-chalk); font-size: 18px; margin: 0; }
.ask small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--chalk-dim); letter-spacing: .08em; }

.bubble {
  background: var(--paper);
  color: var(--ink);
  border-radius: 14px;
  padding: 14px 14px 10px;
  position: relative;
  display: grid;
  gap: 8px;
}
.bubble::before {
  content: "AIの答え";
  font-size: 11px; font-weight: 700; letter-spacing: .12em;
  color: #fff; background: #4a6b8a;
  border-radius: 999px; padding: 2px 10px; justify-self: start;
}
.seg {
  display: block; width: 100%; text-align: left;
  font: inherit; font-size: 16px; line-height: 1.7; color: inherit;
  background: #f1efe3; border: 2px solid transparent; border-radius: 10px;
  padding: 8px 10px; cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
}
.seg:hover { background: #e9f0ea; }
.seg:active { transform: scale(.99); }
.seg:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.seg[disabled] { cursor: default; }
.seg.picked-ng { border-color: #9aa7a0; background: #eceae0; color: #6a746f; text-decoration: line-through; text-decoration-color: #9aa7a0; }
.seg.wrong { border-color: var(--red); background: #ffe9e5; }
.seg.wrong.found { animation: circle .5s ease-out; }
@keyframes circle { from { box-shadow: 0 0 0 0 rgba(255,122,107,.6); } to { box-shadow: 0 0 0 10px rgba(255,122,107,0); } }

.feedback { display: grid; gap: 10px; }
.fix {
  background: rgba(0,0,0,.18); border-left: 4px solid var(--red);
  border-radius: 4px; padding: 10px 12px;
}
.fix b { font-family: var(--f-chalk); font-weight: 600; color: var(--red); font-size: 17px; }
.fix p { margin: 4px 0 0; }
.kuro-says { display: flex; gap: 10px; align-items: flex-start; }
.kuro-says img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--gold); flex: none; }
.kuro-says p { margin: 0; font-family: var(--f-chalk); font-size: 17px; min-width: 0; }

.btn {
  font: inherit; font-weight: 900; font-size: 17px;
  background: var(--gold); color: #2b2210; border: none; border-radius: 999px;
  padding: 12px 22px; cursor: pointer; justify-self: center;
  box-shadow: 0 4px 0 #a97f26;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a97f26; }
.btn:focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--chalk); box-shadow: inset 0 0 0 2px var(--chalk-dim); }

.result { text-align: center; display: grid; gap: 12px; justify-items: center; }
.result .score { font-family: var(--f-chalk); font-size: clamp(44px, 12vw, 64px); line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.result .score span { font-size: .45em; color: var(--chalk); }
.result .rank { font-family: var(--f-chalk); font-size: 22px; margin: 0; }
.result p { margin: 0; }
.motto { font-family: var(--f-chalk); font-size: 18px; border-top: 2px dashed rgba(243,241,231,.35); padding-top: 12px; }

.seg.marked { border-color: var(--red); background: #fff1ee; }
.seg.marked::after { content: "あやしい"; float: right; margin-left: 8px; font-size: 11px; font-weight: 700; color: #fff; background: var(--red); border-radius: 999px; padding: 1px 8px; }
.seg.hit { border-color: var(--red); background: #ffe9e5; }
.seg.miss { border: 2px dashed var(--red); background: #fff6f4; }
.seg.false { border-color: #9aa7a0; background: #eceae0; color: #5f6a64; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; margin-right: 6px; vertical-align: 2px; }
.tag.hit { background: var(--red); color: #fff; }
.tag.miss { background: #fff; color: #c2493b; box-shadow: inset 0 0 0 1.5px #c2493b; }
.tag.false { background: #9aa7a0; color: #fff; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.hint { margin: 0; color: var(--chalk-dim); font-size: 14px; }
.check { display: grid; gap: 8px; }
.check h3 { margin: 0; font-family: var(--f-chalk); font-weight: 600; font-size: 18px; color: var(--gold); }
.choice { font: inherit; font-size: 15px; text-align: left; color: var(--chalk); background: rgba(0,0,0,.18); border: 2px solid rgba(243,241,231,.35); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.choice:hover { border-color: var(--chalk); }
.choice:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.choice[disabled] { cursor: default; }
.choice.right { border-color: var(--ok); background: rgba(143,216,168,.18); }
.choice.wrongpick { border-color: var(--red); opacity: .8; }
.pts { font-family: var(--f-chalk); color: var(--gold); font-weight: 600; }
.tray { height: 10px; background: var(--wood); border-radius: 0 0 4px 4px; margin-top: -18px; box-shadow: 0 3px 0 #4b3320; }

.teacher {
  background: var(--paper); color: var(--ink);
  border-radius: 10px; padding: 16px 16px 14px; font-size: 14px; line-height: 1.8;
}
.teacher h2 { font-size: 15px; margin: 0 0 6px; letter-spacing: .04em; }
.teacher ul { margin: 0; padding-left: 1.2em; }
.teacher .foot { margin-top: 10px; color: #5b6a62; font-size: 12px; }
.teacher a { color: #2f6b55; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.back { display:inline-block; color: var(--chalk-dim); font-size: 14px; text-decoration: none; margin-bottom: 4px; }
.back:hover { color: var(--chalk); }
</style>
</head>

<div class="wrap">
  <a class="back" href="../">← クロ先生のAI職員室</a>
  <section class="board" id="board" aria-live="polite"></section>
  <div class="tray" aria-hidden="true"></div>

  <aside class="teacher">
    <h2>先生へ：授業での使い方</h2>
    <ul>
      <li>1回5問・約5〜8分。授業の導入や、情報モラルの時間の最初に。</li>
      <li>AIの説明文には、まちがいが0〜2か所まざっています。数字のすり替え、言葉の取り違え、言い過ぎ、それらしい作り話など、AIが実際にやりがちな間違い方です。</li><li>見つけたあとに「どう確かめるか」も選びます。</li>
      <li>ログイン不要。名前や点数はどこにも送られず、保存もされません。</li>
      <li>遊んだあと「どうやって間違いに気づいた？」と聞くと、確かめ方の話し合いにつながります。</li>
    </ul>
    <p class="foot">作：クロラボ（クロ先生のAI職員室）・試作版。問題はすべてクロラボのオリジナルです。</p>
  </aside>
</div>

  { sub: "中2 英語・比較", q: "比較級と最上級のつくり方は？",
    segs: ["2 つのものを比べるときは、比較級を使います。",
           "tall の比較級は taller、最上級は tallest です。",
           "beautiful のような長い語は、more beautiful、most beautiful の形にします。",
           "good の比較級は better、最上級は best です。",
           "「〜の中で一番…」と言うときは、最上級の前に the をつけます。"],
    bad: {},
    check: { q: "「まちがいなし」と言い切るには、どうするのが一番？",
      opts: ["AIが自信ありそうに書いているので大丈夫と考える", "英語っぽい文なので大丈夫と考える", "教科書の比較の表と、1 つずつ照らし合わせる"], ok: 2,
      why: "正しいかどうかは、AIの自信ではなく、確かな資料と照らして決めます。今回は全部正しい回でした。" } },

  { sub: "中1 理科・ガスバーナー", q: "ガスバーナーの使い方を教えて！",
    segs: ["元栓を開けたら、マッチの火を近づけてから、ガス調節ねじを少しずつ開いて火をつけます。",
           "空気が足りないと、炎はオレンジ色になります。",
           "「オレンジ色の炎のまま使うと爆発する」と、2023 年の文部科学省の調査で報告されています。",
           "空気調節ねじを開いて、炎が青色になるように調節します。",
           "火を消すときは、空気調節ねじ、ガス調節ねじ、元栓の順に閉じます。"],
    bad: { 2: ["それらしい作り話", "このような調査はありません。AIは、それらしい「出典」や「調査」を作ってしまうことがあります。オレンジ色の炎はすすが出やすく、加熱に向かないので調節します。"] },
    check: { q: "このまちがいに気づくには、どう確かめるのが一番？",
      opts: ["「文部科学省」と書いてあるので信じる", "その調査が本当にあるか、文部科学省のサイトなどで調べる", "2023 年と新しいので信じる"], ok: 1,
      why: "有名な組織の名前や年号がついていても、本当にあるとは限りません。出典は、元の資料を自分で見て確かめます。" } },

  { sub: "中1 社会・世界地理", q: "大陸と海洋について教えて！",
    segs: ["世界には 6 つの大陸があります。",
           "最も面積が大きい大陸は、ユーラシア大陸です。",
           "三大洋とは、太平洋・大西洋・インド洋のことです。",
           "三大洋のうち、最も広いのは大西洋です。",
           "赤道は、アフリカ大陸や南アメリカ大陸を通っています。"],
    bad: { 3: ["言葉のすり替え", "最も広い海洋は太平洋です。大西洋は 2 番目です。"] },
    check: { q: "このまちがいに気づくには、どう確かめるのが一番？",
      opts: ["地図帳の統計のページで、海洋の面積を確かめる", "AIに「本当？」と聞いて、はいと言われたら信じる", "名前を聞いたことがあるので信じる"], ok: 0,
      why: "AIに「本当？」と聞くと、まちがいでも「はい」と答えることがあります。地図帳のような資料で確かめましょう。" } },

  { sub: "中2 理科・血液と循環", q: "血液のはたらきと血管について教えて！",
    segs: ["赤血球は、酸素を運ぶはたらきをします。",
           "白血球は、体内に入った細菌などをとらえるはたらきをします。",
           "血小板は、出血したときに血液を固めるはたらきをします。",
           "血しょうは、養分や二酸化炭素などを運びます。",
           "心臓から送り出された血液が流れる血管を、静脈といいます。",
           "静脈には、血液の逆流を防ぐ弁がありません。"],
    bad: { 4: ["言葉の取りちがえ", "心臓から送り出された血液が流れるのは「動脈」です。心臓にもどる血液が流れるのが静脈です。"],
           5: ["反対の内容", "静脈には、血液の逆流を防ぐ弁があります。"] },
    check: { q: "このまちがいに気づくには、どう確かめるのが一番？",
      opts: ["教科書の血液の循環の図で確かめる", "前の 4 つが正しいので、残りも正しいと考える", "AIに同じ質問をして、答えが同じなら信じる"], ok: 0,
      why: "正しい文が続いたあとに、まちがいがまぎれこむことがあります。前半が正しくても、最後まで確かめましょう。" } },
];

const ROUND = 5;
const board = document.getElementById("board");
let qs = [], idx = 0, pts = [], marked = new Set();

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v; else e.setAttribute(k, v); }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c && e.append(c));
  return e;
}
function header(sub) {
  return el("header", { class: "top" }, [
    el("img", { src: KURO, alt: "クロ先生" }),
    el("div", {}, [el("h1", { text: "AIのまちがい探し" }), el("p", { text: sub })])
  ]);
}
function kuroSays(text) { return el("div", { class: "kuro-says" }, [el("img", { src: KURO, alt: "" }), el("p", { text })]); }

function start() {
  qs = shuffle(BANK).slice(0, ROUND); idx = 0; pts = [];
  board.replaceChildren(
    header("クロ先生の AI 職員室"),
    kuroSays("AIはとても賢いけれど、ときどき自信満々にまちがえます。AIの説明文には、まちがいが 0〜2 か所まざっています。あやしい文をタップして見つけてください。"),
    kuroSays("見抜けたら 1 点、正しい確かめ方を選べたらもう 1 点。全 5 問、10 点満点です。"),
    el("button", { class: "btn", id: "start-btn", type: "button", text: "はじめる" })
  );
  document.getElementById("start-btn").onclick = show;
}

function hud() {
  const dots = el("div", { class: "dots", "aria-label": `${idx + 1}問目 / ${ROUND}問` });
  for (let i = 0; i < ROUND; i++) {
    const p = pts[i];
    dots.append(el("span", { class: "dot" + (p === undefined ? (i === idx ? " now" : "") : (p >= 1 ? " ok" : " ng")) }));
  }
  const total = pts.reduce((a, b) => a + b, 0);
  return el("div", { class: "hud" }, [el("span", { class: "subject", text: qs[idx].sub }), el("span", { class: "pts", text: `${total} 点` }), dots]);
}

function show() {
  const q = qs[idx]; marked = new Set();
  const bubble = el("div", { class: "bubble", id: "bubble" });
  q.segs.forEach((s, i) => {
    const b = el("button", { class: "seg", type: "button", "data-i": i, "aria-pressed": "false", text: s });
    b.onclick = () => {
      if (marked.has(i)) marked.delete(i); else marked.add(i);
      b.classList.toggle("marked", marked.has(i));
      b.setAttribute("aria-pressed", String(marked.has(i)));
      judgeBtn.textContent = marked.size ? `これで判定（${marked.size}か所）` : "まちがいなし！で判定";
    };
    bubble.append(b);
  });
  const judgeBtn = el("button", { class: "btn", type: "button", id: "judge-btn", text: "まちがいなし！で判定" });
  judgeBtn.onclick = judge;
  board.replaceChildren(
    hud(),
    el("p", { class: "ask" }, [el("small", { text: "生徒の質問" }), document.createTextNode(q.q)]),
    bubble,
    el("div", { class: "feedback", id: "fb" }, [
      el("p", { class: "hint", text: "あやしい文をタップ（もう一度タップで取り消し）。まちがいがないと思ったら、そのまま判定へ。" }),
      el("div", { class: "actions" }, judgeBtn)
    ])
  );
}

function judge() {
  const q = qs[idx];
  const bad = Object.keys(q.bad).map(Number);
  const exact = bad.length === marked.size && bad.every(i => marked.has(i));
  pts[idx] = exact ? 1 : 0;
  const bubble = document.getElementById("bubble");
  bubble.querySelectorAll(".seg").forEach(b => {
    const i = Number(b.dataset.i); b.disabled = true; b.classList.remove("marked");
    const isBad = bad.includes(i), m = marked.has(i);
    if (isBad) b.classList.add(m ? "hit" : "miss");
    else if (m) b.classList.add("false");
    if (isBad || m) {
      const label = isBad ? (m ? "見抜いた！" : "見のがし") : "正しい文";
      b.prepend(el("span", { class: "tag " + (isBad ? (m ? "hit" : "miss") : "false"), text: label }));
    }
  });
  const msg = exact
    ? (bad.length === 0 ? "正解！今回はまちがいなしの回でした。「全部正しい」と言い切るのも大事な判断です。" : "お見事！まちがいをぴったり見抜きました。")
    : (bad.length === 0 ? "今回は、まちがいのない回でした。正しい文を疑いすぎるのも、AIとのつき合い方では気をつけたいところです。"
                        : "おしい！色のついた文を見てください。");
  const fixes = bad.map(i => el("div", { class: "fix" }, [
    el("b", { text: `${q.bad[i][0]}` }),
    el("p", { text: q.bad[i][1] })
  ]));
  const fb = document.getElementById("fb");
  fb.replaceChildren(kuroSays(msg), ...fixes, checkBlock(q));
}

function checkBlock(q) {
  const box = el("div", { class: "check" }, [el("h3", { text: q.check.q })]);
  const order = shuffle(q.check.opts.map((t, i) => i));
  order.forEach(i => {
    const c = el("button", { class: "choice", type: "button", text: q.check.opts[i] });
    c.onclick = () => {
      box.querySelectorAll(".choice").forEach(x => x.disabled = true);
      const ok = i === q.check.ok;
      if (ok) pts[idx] += 1;
      box.querySelectorAll(".choice").forEach(x => { if (x.textContent === q.check.opts[q.check.ok]) x.classList.add("right"); });
      if (!ok) c.classList.add("wrongpick");
      const last = idx === ROUND - 1;
      const next = el("button", { class: "btn", type: "button", id: "next-btn", text: last ? "結果を見る" : "次の問題へ" });
      next.onclick = () => { if (last) result(); else { idx++; show(); } };
      box.append(kuroSays((ok ? "その通り！ " : "おしい。 ") + q.check.why), next);
      next.focus({ preventScroll: true });
    };
    box.append(c);
  });
  return box;
}

function result() {
  const score = pts.reduce((a, b) => a + b, 0), max = ROUND * 2;
  const [rank, msg] =
    score >= 9 ? ["AIチェック名人", "見抜く力も、確かめる力もばっちりです。AIを上手に使いこなせる人です。"] :
    score >= 6 ? ["AIチェック上級", "かなり見抜けています。「数字」「人名」「必ず」「〜の調査では」が出てきたら、特に注意してみましょう。"] :
    score >= 3 ? ["AIチェック見習い", "AIのまちがいは、正しい文の中にまぎれこむので大人でも難しいです。もう一回やると、別の問題が出ます。"] :
                 ["これから伸びる人", "大丈夫。今日、AIもまちがえると知ったことが一番の収穫です。"];
  board.replaceChildren(
    header("結果発表"),
    el("div", { class: "result" }, [
      el("div", { class: "score", html: `${score}<span> / ${max} 点</span>` }),
      el("p", { class: "rank", text: rank }),
      el("p", { text: msg }),
      el("p", { class: "motto", text: "AIの答えは、最後は自分で確かめよう。" }),
      el("button", { class: "btn", type: "button", id: "again-btn", text: "もう一回（別の問題）" })
    ])
  );
  document.getElementById("again-btn").onclick = start;
}

start();
</script>
</body>
</html>
