<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>さんすうクエスト</title>
<meta name="description" content="クロ先生がマップを冒険！宝箱やモンスターに出会うと算数クイズ。小学5年の算数で宝物とぼうしを集めよう。ログイン不要・無料。">
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: top HUD, square-ish tile map on canvas, D-pad below. Quiz opens as a classic RPG window over the map. Single deliberate dark look. */
:root {
  --night: #101a33; --win: #0b0b10; --frame: #f4f1e6; --text: #f4f1e6; --dim: #a9b1c6;
  --gold: #f2c14e; --hp: #5fd38d; --hurt: #ff6b5b;
  --f: "DotGothic16", "Hiragino Kaku Gothic ProN", "Meiryo", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--night); overscroll-behavior: none; }
body { color: var(--text); font-family: var(--f); font-size: 17px; line-height: 1.6; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 8px;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
button { font-family: var(--f); touch-action: manipulation; }
.win { background: var(--win); border: 3px solid var(--frame); border-radius: 10px; box-shadow: 0 0 0 3px var(--win); padding: 12px 14px; }
.btn { font-size: 18px; color: var(--win); background: var(--gold); border: 3px solid var(--frame); border-radius: 10px; padding: 10px 20px; cursor: pointer; }
.btn.ghost { background: var(--win); color: var(--text); }
.btn:focus-visible, .cmd:focus-visible, .world:focus-visible, .pad button:focus-visible, .icon-btn:focus-visible, .hat:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); }
.bar a { color: var(--dim); text-decoration: none; }
.icon-btn { background: none; border: 2px solid var(--dim); color: var(--dim); border-radius: 8px; font-size: 13px; padding: 2px 8px; cursor: pointer; }

.title { text-align: center; display: grid; gap: 8px; justify-items: center; }
.title h1 { font-size: clamp(34px, 10vw, 50px); margin: 0; color: var(--gold); text-shadow: 3px 3px 0 #000; line-height: 1.2; font-weight: 400; }
.title p { margin: 0; }
.purse { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 15px; color: var(--dim); }
.purse b { color: var(--gold); font-weight: 400; }
.worlds { display: grid; gap: 8px; }
.world { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; text-align: left; color: var(--text); background: var(--win); border: 3px solid var(--frame); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.world b { font-size: 18px; font-weight: 400; }
.world small { grid-column: 1; color: var(--dim); font-size: 13px; }
.world .stars { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--gold); letter-spacing: 2px; }
.world[disabled] { opacity: .45; cursor: not-allowed; }
details.win summary { cursor: pointer; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-top: 8px; }
.shelf div { border: 2px solid #333a4d; border-radius: 8px; text-align: center; font-size: 11px; color: var(--dim); padding: 4px 2px; }
.shelf div span { display: block; font-size: 26px; line-height: 1.3; }
.hats { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 8px; }
.hat { background: #151520; color: var(--text); border: 2px solid #333a4d; border-radius: 8px; padding: 6px; cursor: pointer; font-size: 12px; }
.hat canvas { display: block; margin: 0 auto; }
.hat.on { border-color: var(--gold); }
.hat[disabled] { cursor: default; opacity: .5; }
.gacha { display: grid; gap: 8px; justify-items: center; margin-top: 8px; }

.hud { display: flex; justify-content: space-between; align-items: center; font-size: 16px; gap: 6px; flex-wrap: wrap; }
.hud .hearts { color: var(--hurt); letter-spacing: 1px; }
.hud .gems { color: #7fe3ff; }
.hud .coins { color: var(--gold); }
.stagebox { position: relative; }
canvas#map { display: block; width: 100%; border: 3px solid var(--frame); border-radius: 10px; background: #000; touch-action: none; image-rendering: pixelated; }
.toast.rare { background: linear-gradient(90deg, #f2c14e, #ff8fb0, #7ad1ff, #a6f08a, #f2c14e); background-size: 300% 100%; color: #1b1b2b; font-weight: 700; border-color: #fff; font-size: 17px; animation: toast 2.6s forwards, shine 1s linear infinite; }
@keyframes shine { to { background-position: 300% 0; } }
.shelf div.rare { border-color: var(--gold); box-shadow: 0 0 8px rgba(242,193,78,.45); }
.shelf h4 { grid-column: 1 / -1; margin: 6px 0 0; font-weight: 400; color: var(--gold); font-size: 14px; }
.topics { display: grid; gap: 6px; margin-top: 8px; }
.topics fieldset { border: 2px solid #333a4d; border-radius: 8px; padding: 4px 10px 8px; margin: 0; }
.topics legend { color: var(--gold); font-size: 14px; padding: 0 4px; }
.topics label { display: inline-flex; align-items: center; gap: 4px; margin: 4px 14px 0 0; font-size: 15px; cursor: pointer; }
.topics input { width: 20px; height: 20px; accent-color: var(--gold); }
.topics .row2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.quiz .topic { color: var(--dim); font-size: 12px; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--win); border: 2px solid var(--frame); border-radius: 8px; padding: 4px 12px; font-size: 15px; white-space: nowrap; pointer-events: none; animation: toast 1.4s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -6px); } 12%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

.pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 56px); gap: 6px; justify-content: center; }
.pad button { background: var(--win); border: 3px solid var(--frame); border-radius: 10px; color: var(--text); font-size: 22px; cursor: pointer; }
.pad button:active, .pad button.held { background: #2a2a3a; }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
.help { text-align: center; color: var(--dim); font-size: 12px; margin: 0; }

.quiz { position: absolute; inset: 0; display: grid; align-content: end; padding: 8px; background: rgba(0,0,0,.35); }
.quiz .win { display: grid; gap: 8px; }
.quiz .who { color: var(--gold); font-size: 14px; }
.quiz .q { font-size: 20px; line-height: 1.5; }
.quiz .ex { color: var(--gold); font-size: 14px; }
.cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmd { font-size: 19px; color: var(--text); background: #15151f; border: 3px solid var(--frame); border-radius: 10px; padding: 10px 6px; cursor: pointer; min-height: 54px; }
.cmd.ok { border-color: var(--hp); color: var(--hp); }
.cmd.ng { border-color: var(--hurt); color: var(--hurt); opacity: .75; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 2px; font-size: .9em; }
.fr .n { border-bottom: 2px solid currentColor; padding: 0 3px; }
.fr .d { padding: 0 3px; }
.mixed { display: inline-flex; align-items: center; gap: 1px; }
.result { text-align: center; display: grid; gap: 10px; justify-items: center; }
.result h2 { font-size: 28px; margin: 0; color: var(--gold); font-weight: 400; text-shadow: 2px 2px 0 #000; }
.result .big { font-size: 38px; color: var(--gold); letter-spacing: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.foot { color: var(--dim); font-size: 12px; text-align: center; margin-top: auto; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ---------- 小さな道具 ----------
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = R(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a / gcd(a, b) * b;
const dec = (int, places) => { const s = (int / 10 ** places).toFixed(places); return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s; };
function el(tag, attrs = {}, kids = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "text") e.textContent = v; else if (k === "html") e.innerHTML = v; else if (k.startsWith("on")) e[k] = v; else e.setAttribute(k, v); }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && e.append(c));
  return e;
}
// 分数 {n,d} → HTML（約分済み・帯分数で表示）
function fr(n, d) {
  const g = gcd(n, d); n /= g; d /= g;
  if (d === 1) return String(n);
  const w = Math.floor(n / d), r = n % d;
  const f = `<span class="fr"><span class="n">${r}</span><span class="d">${d}</span></span>`;
  return w ? `<span class="mixed">${w}${f}</span>` : f;
}
const frKey = (n, d) => { const g = gcd(n, d); return `${n / g}/${d / g}`; };


// ---------- 問題をつくる ----------
// 返り値: { q: 問題HTML, ans: 正解HTML, wrong: [まちがい候補HTML...], ex: 解説 }
function choices(ans, wrong, filler) {
  const out = [ans], seen = new Set([ans]);
  for (const w of shuffle(wrong)) { if (out.length >= 4) break; if (!seen.has(w)) { seen.add(w); out.push(w); } }
  let guard = 0;
  while (out.length < 4 && guard++ < 50) { const w = filler(); if (!seen.has(w)) { seen.add(w); out.push(w); } }
  return shuffle(out);
}

const F = (x, y) => `<span class="fr"><span class="n">${x}</span><span class="d">${y}</span></span>`;
// 問題の種類（topic）。world はどのワールドで出るか。
const TOPICS = [
  // 0. ふくしゅうの草原（4年のふくしゅう）
  { id: "imul", world: 0, name: "整数のかけ算", gen() {
    const a = Math.random() < .5 ? R(12, 99) : R(101, 499), b = a > 100 ? R(2, 9) : R(12, 49), P = a * b;
    return { q: `${a} × ${b} ＝ ？`, ans: String(P), wrong: [String(P + 10), String(P - 10), String(P + b), String(a * (b + 1))], filler: () => String(P + R(-40, 40)),
      ex: b > 10 ? `${a} × ${b % 10} ＝ ${a * (b % 10)}、${a} × ${b - b % 10} ＝ ${a * (b - b % 10)}。たして ${P}。` : `筆算で、一の位からじゅんにかけます。${a} × ${b} ＝ ${P}。` }; } },
  { id: "idiv", world: 0, name: "わり算（あまりあり）", gen() {
    const b = R(3, 9), q = R(12, 99), r = R(0, b - 1), a = b * q + r, A = r ? `${q} あまり ${r}` : `${q}`;
    return { q: `${a} ÷ ${b} ＝ ？`, ans: A, wrong: [r ? `${q} あまり ${r + 1 < b ? r + 1 : r - 1}` : `${q} あまり 1`, `${q + 1}${r ? ` あまり ${r}` : ""}`, `${q - 1} あまり ${r + b > 9 ? r : r + b}`, `${q}${r ? "" : " あまり 2"}`],
      filler: () => `${q + R(-3, 3)} あまり ${R(1, b - 1)}`, ex: `${b} × ${q} ＝ ${b * q}。${a} − ${b * q} ＝ ${r}${r ? `。あまり ${r} は わる数 ${b} より小さいのでOK。` : "。わりきれます。"}` }; } },
  { id: "dadd", world: 0, name: "小数のたし算・ひき算", gen() {
    const A = R(105, 999), B = R(15, 499), plus = Math.random() < .5 || A <= B;
    const P = plus ? A + B : A - B, a = dec(A, 2), b = dec(B, 2), ans = dec(P, 2);
    return { q: `${a} ${plus ? "＋" : "−"} ${b} ＝ ？`, ans, wrong: [dec(P, 1), dec(P + 10, 2), dec(P - 10, 2), dec(P + 1, 2)], filler: () => dec(P + R(-50, 50), 2),
      ex: `小数点の位置をそろえて、整数と同じように計算します。${a} ${plus ? "＋" : "−"} ${b} ＝ ${ans}。` }; } },
  // 1. 小数の森
  { id: "dmul", world: 1, name: "小数のかけ算", gen() {
    const A = R(11, 99), B = Math.random() < .5 ? R(2, 9) * 10 : R(11, 49), P = A * B;
    const a = dec(A, 1), b = dec(B, 1), ans = dec(P, 2);
    return { q: `${a} × ${b} ＝ ？`, ans, wrong: [dec(P, 1), dec(P, 3), dec(P + 10, 2), dec(P - 10, 2), dec(P, 0)],
      filler: () => dec(P + R(-30, 30), 2), ex: B % 10 === 0 ? `小数点をとって ${A} × ${B / 10} ＝ ${A * B / 10}。小数点の下は 1けたなので、${ans}。` : `${A} × ${B} ＝ ${P} を計算して、小数点の下のけた数（1 ＋ 1 ＝ 2けた）だけ小数点をうつと ${ans}。` }; } },
  { id: "ddiv", world: 1, name: "小数のわり算", gen() {
    const k = R(2, 9), r = R(11, 99), D = r * k, ans = dec(r, 1);
    return { q: `${dec(D, 1)} ÷ ${k} ＝ ？`, ans, wrong: [dec(r, 0), dec(r, 2), dec(r + 1, 1), dec(r - 1, 1), dec(r + 10, 1)],
      filler: () => dec(r + R(-15, 15), 1), ex: `${D} ÷ ${k} ＝ ${r}。わられる数の小数点の位置に合わせて、答えは ${ans}。` }; } },
  // 2. 分数の洞くつ
  { id: "fsame", world: 2, name: "分母が同じ分数のたし算・ひき算", gen() {
    const d = R(3, 12), a = R(1, d - 1), c = R(1, d - 1), plus = Math.random() < .55 || a <= c;
    const N = plus ? a + c : a - c;
    return { q: `${F(a, d)} ${plus ? "＋" : "−"} ${F(c, d)} ＝ ？`, ans: fr(N, d), wrong: [plus ? F(a + c, d + d) : F(Math.max(1, N), d + d), fr(N + 1, d), fr(Math.max(1, N - 1) === N ? N + 2 : Math.max(1, N - 1), d), F(N, d * 2)],
      filler: () => fr(R(1, 20), d), ex: `分母が同じときは、分子だけを${plus ? "たし" : "ひき"}ます。${plus ? `${a} ＋ ${c}` : `${a} − ${c}`} ＝ ${N} なので ${F(N, d)}。約分や帯分数にできたら直します。` }; } },
  { id: "fred", world: 2, name: "約分", gen() {
    const d = pick([3, 4, 5, 6, 7, 8, 9]); let n = R(1, d - 1); while (gcd(n, d) !== 1) n = R(1, d - 1);
    const k = R(2, 6), N = n * k, Dd = d * k;
    return { q: `${F(N, Dd)} を約分すると？`, ans: fr(n, d), wrong: [F(N / k, Dd), F(n + 1, d), F(n, d + 1), F(d, n)],
      filler: () => fr(R(1, 9), R(2, 12)), ex: `分子と分母を、どちらも ${k} でわると ${n}/${d}。` }; } },
  { id: "fadd", world: 2, name: "分母がちがう分数のたし算・ひき算", gen() {
    const ds = [2, 3, 4, 5, 6, 8, 10, 12];
    let b = pick(ds), d = pick(ds); while (d === b) d = pick(ds);
    let a = R(1, b - 1), c = R(1, d - 1);
    const L = lcm(b, d), plus = Math.random() < .6 || a * (L / b) === c * (L / d);
    if (!plus && a / b < c / d) { [a, b, c, d] = [c, d, a, b]; }
    const N = plus ? a * (L / b) + c * (L / d) : a * (L / b) - c * (L / d), op = plus ? "＋" : "−", wrongN = plus ? a + c : Math.abs(a - c);
    return { q: `${F(a, b)} ${op} ${F(c, d)} ＝ ？`, ans: fr(N, L), wrong: [wrongN ? fr(wrongN, b + d) : "0", fr(N + 1, L), fr(Math.max(1, N - 1), L), fr(N, L * 2)],
      filler: () => fr(R(1, 20), pick([6, 8, 10, 12, 15, 24])), ex: `分母を ${L} にそろえる（通分）と、${F(a * (L / b), L)} ${op} ${F(c * (L / d), L)} ＝ ${F(N, L)}。約分できたら約分します。` }; } },
  // 3. 倍数の山
  { id: "lcm", world: 3, name: "最小公倍数", gen() {
    let a = R(2, 12), b = R(2, 12); while (a === b) b = R(2, 12);
    const L = lcm(a, b);
    return { q: `${a} と ${b} の最小公倍数は？`, ans: String(L), wrong: [String(a * b), String(L * 2), String(gcd(a, b)), String(L + a)], filler: () => String(L + R(-6, 6)), ex: `${a} の倍数と ${b} の倍数で、いちばん小さい共通の数は ${L}。` }; } },
  { id: "gcd", world: 3, name: "最大公約数", gen() {
    const g = pick([2, 3, 4, 5, 6, 8, 9]); let x = R(2, 7), y = R(2, 7); while (x === y || gcd(x, y) !== 1) y = R(2, 7);
    const a = g * x, b = g * y, divs = n => { const r = []; for (let i = 1; i <= n; i++) if (n % i === 0) r.push(i); return r; };
    return { q: `${a} と ${b} の最大公約数は？`, ans: String(g), wrong: [...divs(g).filter(v => v !== g).map(String), String(Math.min(a, b)), String(g * 2), String(lcm(a, b))], filler: () => String(R(1, 12)), ex: `${a} ＝ ${g} × ${x}、${b} ＝ ${g} × ${y}。両方をわりきれるいちばん大きい数は ${g}。` }; } },
  { id: "evod", world: 3, name: "偶数と奇数・倍数", gen() {
    const k = pick([3, 4, 6, 7, 8, 9]), n = R(3, 12) * k, near = [n + 1, n - 1, n + 2, n + k - 1, n - 2].filter(v => v % k);
    return { q: `つぎのうち、${k} の倍数はどれ？`, ans: String(n), wrong: near.map(String), filler: () => String(n + R(1, k - 1)), ex: `${n} ＝ ${k} × ${n / k}。${k} でわりきれる数が ${k} の倍数です。` }; } },
  // 4. 図形の城
  { id: "tri", world: 4, name: "三角形の面積", gen() {
    const s = R(2, 12) * 2, h = R(2, 12), A = s * h / 2;
    return { q: `底辺 ${s}cm、高さ ${h}cm の三角形の面積は？`, ans: `${A}cm²`, wrong: [`${s * h}cm²`, `${s + h}cm²`, `${A + h}cm²`], filler: () => `${A + R(-8, 8)}cm²`, ex: `三角形は「底辺 × 高さ ÷ 2」。${s} × ${h} ÷ 2 ＝ ${A}。` }; } },
  { id: "para", world: 4, name: "平行四辺形・台形の面積", gen() {
    if (Math.random() < .5) { const s = R(3, 15), h = R(2, 12), A = s * h;
      return { q: `底辺 ${s}cm、高さ ${h}cm の平行四辺形の面積は？`, ans: `${A}cm²`, wrong: [`${A / 2}cm²`, `${(s + h) * 2}cm²`, `${s + h}cm²`], filler: () => `${A + R(-10, 10)}cm²`, ex: `平行四辺形は「底辺 × 高さ」。${s} × ${h} ＝ ${A}。` }; }
    let u = R(2, 9), l = R(u + 1, 14), h = R(2, 10); if ((u + l) * h % 2) h++; const A = (u + l) * h / 2;
    return { q: `上底 ${u}cm、下底 ${l}cm、高さ ${h}cm の台形の面積は？`, ans: `${A}cm²`, wrong: [`${(u + l) * h}cm²`, `${u * l * h / 2}cm²`, `${l * h}cm²`], filler: () => `${A + R(-10, 10)}cm²`, ex: `台形は「（上底 ＋ 下底）× 高さ ÷ 2」。(${u} ＋ ${l}) × ${h} ÷ 2 ＝ ${A}。` }; } },
  { id: "vol", world: 4, name: "直方体の体積", gen() {
    const a = R(2, 9), b = R(2, 9), c = R(2, 9), V = a * b * c;
    return { q: `たて ${a}cm、横 ${b}cm、高さ ${c}cm の直方体の体積は？`, ans: `${V}cm³`, wrong: [`${a + b + c}cm³`, `${2 * (a * b + b * c + c * a)}cm³`, `${a * b}cm³`], filler: () => `${V + R(-20, 20)}cm³`, ex: `直方体の体積は「たて × 横 × 高さ」。${a} × ${b} × ${c} ＝ ${V}。` }; } },
  // 5. 割合の塔
  { id: "pct", world: 5, name: "割合（％）", gen() {
    if (Math.random() < .5) { const base = pick([20, 40, 50, 60, 80, 120, 200, 300]); let p = pick([10, 20, 25, 30, 40, 50, 60, 75, 80]); while (base * p % 100) p = pick([10, 20, 50]);
      const A = base * p / 100;

const COLS = 11, ROWS = 13;
let G = null, raf = 0;
function stopGame() { cancelAnimationFrame(raf); if (G) { clearInterval(G.monTimer); G = null; } }

function genMap() {
  for (let tries = 0; tries < 200; tries++) {
    const m = [];
    for (let y = 0; y < ROWS; y++) { m.push([]); for (let x = 0; x < COLS; x++) m[y].push(x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1 ? 1 : (Math.random() < .2 ? 1 : 0)); }
    const start = { x: 1, y: ROWS - 2 }, door = { x: COLS - 2, y: 1 };
    m[start.y][start.x] = 0; m[door.y][door.x] = 0; m[start.y - 1][start.x] = 0; m[start.y][start.x + 1] = 0;
    // つながっているか確認
    const seen = new Set([`${start.x},${start.y}`]), q = [start];
    while (q.length) { const c = q.shift(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = c.x + dx, ny = c.y + dy; const k = `${nx},${ny}`; if (!seen.has(k) && m[ny][nx] === 0) { seen.add(k); q.push({ x: nx, y: ny }); } } }
    if (!seen.has(`${door.x},${door.y}`) || seen.size < 60) continue;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (m[y][x] === 0 && !seen.has(`${x},${y}`)) m[y][x] = 1;
    const free = shuffle([...seen].map(s => { const [x, y] = s.split(",").map(Number); return { x, y }; })
      .filter(p => Math.abs(p.x - start.x) + Math.abs(p.y - start.y) > 2 && !(p.x === door.x && p.y === door.y)));
    return { m, start, door, free };
  }
}

    p: { x: mp.start.x, y: mp.start.y, fx: mp.start.x, fy: mp.start.y, dir: 1 },

}

function renderStage() {
  const cv = el("canvas", { id: "map", width: COLS * 32, height: ROWS * 32, "aria-label": "マップ。矢印ボタンかタップで動かせます" });
  const box = el("div", { class: "stagebox", id: "box" }, cv);
  const pad = el("div", { class: "pad" });
  [["u", "▲", 0, -1], ["l", "◀", -1, 0], ["d", "▼", 0, 1], ["r", "▶", 1, 0]].forEach(([c, t, dx, dy]) => {
    const b = el("button", { class: c, type: "button", "aria-label": { u: "うえ", l: "ひだり", d: "した", r: "みぎ" }[c], text: t });
    const start = e => { e.preventDefault(); G.path = []; G.hold = [dx, dy]; b.classList.add("held"); tryStep(dx, dy); };
    const end = () => { if (G) G.hold = null; b.classList.remove("held"); };
    b.addEventListener("pointerdown", start); b.addEventListener("pointerup", end); b.addEventListener("pointerleave", end); b.addEventListener("pointercancel", end);
    pad.append(b);
  });
  app.replaceChildren(
    topbar(el("button", { class: "icon-btn", type: "button", text: "やめる", style: "margin-right:6px", onclick: () => { SE.tap(); title(); } })),
    el("div", { class: "hud" }, [el("span", { class: "hearts", id: "hh" }), el("span", { class: "gems", id: "hg" }), el("span", { class: "coins", id: "hc" })]),
    box, pad,
    el("p", { class: "help", text: `${G.w.name}：宝箱をあけて 宝石を${G.needGems}こ 集めると、右上のとびらがひらくよ。マップをタップしてもその場所へ歩けます。` })
  );
  cv.addEventListener("pointerdown", e => {
    if (G.quiz) return;
    const r = cv.getBoundingClientRect();
    const tx = Math.floor((e.clientX - r.left) / r.width * COLS), ty = Math.floor((e.clientY - r.top) / r.height * ROWS);
    G.path = findPath(G.p.x, G.p.y, tx, ty);
  });
  hud();
}
function hud() {
  document.getElementById("hh").textContent = "♥".repeat(G.hp) + "♡".repeat(G.maxhp - G.hp);
  document.getElementById("hg").textContent = `◆ ${G.gems}/${G.needGems}`;
  document.getElementById("hc").textContent = `● ${S.coins}`;
}
function toast(t, rare) { const b = document.getElementById("box"); if (!b) return; const d = el("div", { class: "toast" + (rare ? " rare" : ""), text: t }); b.append(d); setTimeout(() => d.remove(), rare ? 2600 : 1400); }
// レアなたからもの：宝箱 12%、モンスター 6%
function tryRare(p, delay = 0) {
  if (Math.random() >= p) return false;
  const k = R(0, G.w.rare.length - 1), id = `${G.w.id}-r${k}`, [e, n] = G.w.rare[k];
  S.rare = S.rare || {}; const isNew = !S.rare[id]; S.rare[id] = 1; S.coins += 5; save();
  setTimeout(() => { SE.rare(); toast(`★レア★ ${e} ${n}${isNew ? "（はじめて！）" : ""} コイン＋5`, true); hud(); }, delay);
  return true;
}

const blocked = (x, y) => G.map[y]?.[x] !== 0 || (x === G.door.x && y === G.door.y && G.gems < G.needGems && false);
function findPath(sx, sy, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return [];
  const goalIsThing = G.chests.some(c => c.x === tx && c.y === ty && !c.open);
  if (G.map[ty][tx] !== 0) return [];
  const prev = new Map([[`${sx},${sy}`, null]]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift(); if (x === tx && y === ty) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy, k = `${nx},${ny}`;
      if (prev.has(k) || G.map[ny]?.[nx] !== 0) continue;
      if (G.chests.some(c => c.x === nx && c.y === ny && !c.open) && !(nx === tx && ny === ty)) continue;
      prev.set(k, [x, y]); q.push([nx, ny]); }
  }
  if (!prev.has(`${tx},${ty}`)) return [];
  const path = []; let cur = [tx, ty];
  while (cur && !(cur[0] === sx && cur[1] === sy)) { path.unshift([cur[0] - prev.get(`${cur[0]},${cur[1]}`)[0], cur[1] - prev.get(`${cur[0]},${cur[1]}`)[1]]); cur = prev.get(`${cur[0]},${cur[1]}`); }
  return goalIsThing || true ? path : path;
}

function tryStep(dx, dy) {
  if (!G || G.quiz) return;
  const now = performance.now(); if (now - G.last < 140) return; G.last = now;
  if (dx) G.p.dir = dx;
  const nx = G.p.x + dx, ny = G.p.y + dy;
  if (G.map[ny]?.[nx] !== 0) return;
  const chest = G.chests.find(c => c.x === nx && c.y === ny && !c.open);
  if (chest) { G.path = []; return openQuiz("chest", chest); }
  G.p.x = nx; G.p.y = ny; SE.step();
  afterMove();
}
function afterMove() {
  const p = G.p;
  const ci = G.coins.findIndex(c => c.x === p.x && c.y === p.y);
  if (ci >= 0) { G.coins.splice(ci, 1); S.coins++; G.coinsGot++; save(); SE.coin(); hud(); }
  const hi = G.hearts.findIndex(c => c.x === p.x && c.y === p.y);
  if (hi >= 0) { G.hearts.splice(hi, 1); if (G.hp < G.maxhp) G.hp++; SE.coin(); toast("ハートをひろった！"); hud(); }
  const mon = G.mons.find(m => m.alive && m.x === p.x && m.y === p.y);
  if (mon) { G.path = []; return openQuiz("mon", mon); }
  if (p.x === G.door.x && p.y === G.door.y) {
    if (G.gems >= G.needGems) return clearWorld();
    toast(`とびらには 宝石が${G.needGems}こ ひつようだ`);
  }
}
function moveMons() {
  if (!G || G.quiz) return;
  G.mons.forEach(m => {
    if (!m.alive) return;
    const dirs = shuffle([[1, 0], [-1, 0], [0, 1], [0, -1], [0, 0]]);
    // ときどきクロ先生に近づく
    if (Math.random() < .35) dirs.unshift([Math.sign(G.p.x - m.x), 0], [0, Math.sign(G.p.y - m.y)]);
    for (const [dx, dy] of dirs) { const nx = m.x + dx, ny = m.y + dy;
      if (G.map[ny]?.[nx] !== 0 || (nx === G.door.x && ny === G.door.y) || G.chests.some(c => c.x === nx && c.y === ny && !c.open) || G.mons.some(o => o !== m && o.alive && o.x === nx && o.y === ny)) continue;
      m.x = nx; m.y = ny; break; }
    if (m.x === G.p.x && m.y === G.p.y) { G.path = []; openQuiz("mon", m); }
  });
}

// ---------- クイズ ----------
function openQuiz(type, target) {
  if (G.quiz) return;
  G.hold = null; document.querySelectorAll(".pad .held").forEach(b => b.classList.remove("held"));
  const Q = makeQ(G.wi); G.quiz = { type, target, Q }; G.total++;
  const who = type === "chest" ? "宝箱には カギがかかっている。とけたら ひらく！" : "モンスターが あらわれた！ 正解で たおせる！";
  const cmds = el("div", { class: "cmds" });
  Q.opts.forEach(o => cmds.append(el("button", { class: "cmd", type: "button", html: o, onclick: e => answer(o, e.currentTarget) })));
  const panel = el("div", { class: "quiz", id: "quiz" }, el("div", { class: "win" }, [el("div", { class: "who", text: who }), el("div", { class: "topic", text: `もんだい：${Q.topic}` }), el("div", { class: "q", html: Q.q }), cmds]));
  document.getElementById("box").append(panel);
  SE.tap();
}
function closeQuiz() { document.getElementById("quiz")?.remove(); if (G) G.quiz = null; }
function answer(o, btn) {
  const { type, target, Q } = G.quiz;
  document.querySelectorAll(".cmd").forEach(b => b.disabled = true);
  if (o === Q.ans) {
    btn.classList.add("ok"); G.correct++; SE.ok();
    setTimeout(() => {
      closeQuiz();
      if (type === "chest") {
        target.open = true; G.gems++;
        const k = R(0, 5), id = `${G.w.id}-${k}`, isNew = !S.items[id]; S.items[id] = 1; S.coins += 2; save(); SE.open();
        toast(`宝石 ＋1！ ${G.w.items[k]} ${G.w.names[k]}${isNew ? "（はじめて！）" : ""}`);
        const gotRare = tryRare(.12, 1500);
        if (G.gems >= G.needGems) setTimeout(() => toast("とびらが ひらいた！ 右上へいそげ！"), gotRare ? 4200 : 1500);
      } else {
        target.alive = false; S.coins += 3; save(); toast("モンスターを たおした！ コイン＋3"); tryRare(.06, 1500);
      }
      hud();
    }, 500);
  } else {
    btn.classList.add("ng"); SE.ng(); G.hp--; hud();
    document.querySelectorAll(".cmd").forEach(b => { if (b.innerHTML === Q.ans) b.classList.add("ok"); });
    const win = document.querySelector("#quiz .win");
    win.append(el("div", { class: "ex", html: "ヒント：" + Q.ex }),
      el("button", { class: "btn ghost", type: "button", text: G.hp > 0 ? "とじる" : "……", style: "justify-self:end;font-size:15px;padding:4px 14px",
        onclick: () => {
          closeQuiz();
          if (G.hp <= 0) return gameOver();
          if (type === "mon") { // モンスターを少しはなす
            const away = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [target.x + dx * 2, target.y + dy * 2]).find(([x, y]) => G.map[y]?.[x] === 0 && !(x === G.p.x && y === G.p.y));
            if (away) { target.x = away[0]; target.y = away[1]; }
          }
        } }));
  }
}

// ---------- 描画 ----------
function loop() {
  raf = requestAnimationFrame(loop);
  if (!G) return;
  const cv = document.getElementById("map"); if (!cv) return;
  const x = cv.getContext("2d"), T = 32, now = performance.now(), w = G.w;
  if (!G.quiz) {
    if (G.hold) tryStep(...G.hold);
    else if (G.path.length && now - G.last >= 140) { const [dx, dy] = G.path.shift(); tryStep(dx, dy); }
  }
  if (!G) return;
  // なめらか移動
  G.p.fx += (G.p.x - G.p.fx) * .35; G.p.fy += (G.p.y - G.p.fy) * .35;
  G.mons.forEach(m => { m.fx += (m.x - m.fx) * .2; m.fy += (m.y - m.fy) * .2; });
  for (let y = 0; y < ROWS; y++) for (let xx = 0; xx < COLS; xx++) {
    if (G.map[y][xx] === 1) { x.fillStyle = w.wall; x.fillRect(xx * T, y * T, T, T); x.fillStyle = w.wallTop; x.fillRect(xx * T + 2, y * T + 2, T - 4, T - 10); }
    else { x.fillStyle = (xx + y) % 2 ? w.floor : w.floor2; x.fillRect(xx * T, y * T, T, T); }
  }
  // とびら
  const open = G.gems >= G.needGems, dx0 = G.door.x * T, dy0 = G.door.y * T;
  x.fillStyle = open ? `hsl(${(now / 8) % 360} 80% 60%)` : "#6b4a2f"; x.fillRect(dx0 + 4, dy0 + 2, T - 8, T - 4);
  x.fillStyle = open ? "#fff" : "#f2c14e"; x.font = "16px sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(open ? "★" : "🔒", dx0 + T / 2, dy0 + T / 2 + 1);
  // コイン・ハート
  G.coins.forEach(c => { const s = Math.abs(Math.sin(now / 300 + c.x)); x.fillStyle = "#f2c14e"; x.beginPath(); x.ellipse(c.x * T + T / 2, c.y * T + T / 2, 7 * (.4 + .6 * s), 7, 0, 0, 7); x.fill(); x.strokeStyle = "#a07818"; x.lineWidth = 2; x.stroke(); });
  G.hearts.forEach(c => { x.font = "18px sans-serif"; x.fillText("❤️", c.x * T + T / 2, c.y * T + T / 2 + Math.sin(now / 250) * 2); });
  // 宝箱
  G.chests.forEach(c => { const X = c.x * T, Y = c.y * T;
    x.fillStyle = c.open ? "#5a4026" : "#9a6a32"; x.fillRect(X + 4, Y + 10, T - 8, T - 14); x.fillStyle = c.open ? "#3a2a18" : "#b98140"; x.fillRect(X + 4, Y + 6, T - 8, 8);
    x.strokeStyle = "#000"; x.lineWidth = 2; x.strokeRect(X + 4, Y + 6, T - 8, T - 10);
    if (!c.open) { x.fillStyle = "#f2c14e"; x.fillRect(X + T / 2 - 3, Y + 12, 6, 7); if (Math.sin(now / 200 + c.x) > .7) { x.fillStyle = "#fff"; x.fillRect(X + T - 9, Y + 4, 3, 3); } } });
  // モンスター
  G.mons.forEach(m => { if (!m.alive) return; const X = m.fx * T + T / 2, Y = m.fy * T + T / 2 + 4, sq = Math.sin(now / 180 + m.hue) * 1.5;
    x.fillStyle = `hsl(${m.hue} 65% 55%)`; x.strokeStyle = "#000"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(X - 12, Y + 9); x.quadraticCurveTo(X - 13, Y - 12 - sq, X, Y - 13 - sq); x.quadraticCurveTo(X + 13, Y - 12 - sq, X + 12, Y + 9); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = "#fff"; x.beginPath(); x.arc(X - 4, Y - 2, 3.5, 0, 7); x.arc(X + 4, Y - 2, 3.5, 0, 7); x.fill(); x.fillStyle = "#000"; x.beginPath(); x.arc(X - 4, Y - 1, 1.8, 0, 7); x.arc(X + 4, Y - 1, 1.8, 0, 7); x.fill(); });
  // クロ先生
  const moving = Math.abs(G.p.x - G.p.fx) + Math.abs(G.p.y - G.p.fy) > .05;
  drawCat(x, G.p.fx * T + T / 2, G.p.fy * T + T / 2 - 2, 13, S.hat, moving ? -Math.abs(Math.sin(now / 70)) * 3 : 0);
}
document.addEventListener("keydown", e => {
  if (!G || G.quiz) return;
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
  if (k) { e.preventDefault(); G.path = []; G.last = 0; tryStep(...k); }
});

// ---------- クリア・ゲームオーバー ----------
function clearWorld() {
  SE.door();
  const st = G.hp >= 4 ? 3 : G.hp >= 2 ? 2 : 1, g = G;
  S.stars[g.w.id] = Math.max(S.stars[g.w.id] || 0, st); S.coins += 5; save();
  stopGame();
  const next = WORLDS[g.wi + 1];
  app.replaceChildren(topbar(), el("div", { class: "win result" }, [
    el("h2", { text: `${g.w.name} クリア！` }), el("div", { class: "big", text: "★".repeat(st) + "☆".repeat(3 - st) }),
    el("p", { text: `クイズ正解 ${g.correct} / ${g.total}　ひろったコイン ${g.coinsGot}枚（クリアボーナス＋5）` }),
    el("p", { text: S.coins >= GACHA_COST ? `コインが ${S.coins}枚！ ぼうしガチャがまわせるよ。` : `コイン ${S.coins}枚。${GACHA_COST}枚でぼうしガチャ！` }),
    el("div", { class: "row" }, [next ? el("button", { class: "btn", type: "button", text: `つぎ：${next.name}`, onclick: () => { SE.tap(); startWorld(g.wi + 1); } }) : null,
      el("button", { class: "btn ghost", type: "button", text: "タイトルへ", onclick: () => { SE.tap(); title(); } })])
  ]));
}
function gameOver() {
  SE.lose(); const g = G; stopGame();
  app.replaceChildren(topbar(), el("div", { class: "win result" }, [
    el("h2", { text: "クロ先生は つかれてしまった…" }), el("p", { text: `クイズ正解 ${g.correct} / ${g.total}。集めたコインとたからものは そのまま残っているよ。` }),
    el("div", { class: "row" }, [el("button", { class: "btn", type: "button", text: "もう一回", onclick: () => { SE.tap(); startWorld(g.wi); } }),
      el("button", { class: "btn ghost", type: "button", text: "タイトルへ", onclick: () => { SE.tap(); title(); } })])
  ]));
}
KURO.onload = () => { if (!G) title(); };
title();
</script>
